<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IDE Geoespacial — LABMODEL/GEOTEG/UERJ</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body { margin:0; font-family:'Segoe UI', Arial, sans-serif; display:flex; background:#f4f6fb; }
    .sidebar { width:380px; height:100vh; background:linear-gradient(180deg, #162f6a 0%, #1f3c88 100%); color:white; padding:18px; box-sizing:border-box; overflow-y:auto; box-shadow: 2px 0 12px rgba(0,0,0,0.25); z-index: 1000; }
    .sidebar h2 { margin-top:0; font-size:20px; border-bottom:1px solid rgba(255,255,255,0.2); padding-bottom:10px; }
    .nav-grid { display:grid; grid-template-columns: 1fr 1fr; gap:6px; margin-bottom:12px; }
    .sidebar a.nav-link { display:block; color:white; text-decoration:none; padding:7px 10px; background:rgba(255,255,255,.12); border-radius:5px; font-size:13px; text-align:center; transition:0.2s; }
    .sidebar a.nav-link:hover { background:rgba(255,255,255,.28); }
    #map { flex:1; height:100vh; }

    .status-badge { display:none; background:#f59e0b; color:#111; padding:8px; border-radius:6px; font-size:12px; font-weight:bold; margin-bottom:12px; text-align:center; }

    .ferramentas-sig { background:rgba(0,0,0,0.22); padding:10px; border-radius:6px; margin-bottom:14px; font-size:13px; }
    .ferramentas-sig label { display:block; font-weight:bold; margin-bottom:6px; }
    .btn-acao-sig { width:100%; background:#2563eb; color:white; border:1px solid rgba(255,255,255,0.3); padding:7px; border-radius:4px; cursor:pointer; font-size:12px; margin-top:4px; }
    .btn-acao-sig:hover { background:#1d4ed8; }

    .categoria { margin-top:12px; background:rgba(255,255,255,.10); border-radius:6px; overflow:hidden; border:1px solid rgba(255,255,255,0.12); }
    .categoria-titulo { padding:10px 12px; cursor:pointer; background:rgba(255,255,255,.16); font-weight:bold; font-size:14px; display:flex; justify-content:space-between; align-items:center; }
    .categoria-conteudo { padding:8px; display:block; }

    .layer-item { margin-bottom:8px; }
    .layer-btn { width:100%; background:rgba(255,255,255,.14); color:white; border:none; padding:8px 10px; margin:3px 0; border-radius:4px; cursor:pointer; text-align:left; font-size:13px; transition:0.15s; }
    .layer-btn:hover { background:rgba(255,255,255,.28); }

    .layer-box { display:none; background:rgba(0,0,0,.22); padding:10px; border-radius:6px; margin-top:4px; font-size:13px; }
    .layer-box p { margin: 5px 0; }
    .layer-link { display:block; background:white; color:#1f3c88; padding:7px; border-radius:4px; text-decoration:none; margin-top:6px; text-align:center; font-weight:bold; font-size:12px; }

    .tag { display:inline-block; background:#e0e7ff; color:#1e3a8a; padding:3px 8px; border-radius:12px; font-size:11px; font-weight:bold; margin-bottom:6px; }

    .opacidade-box { margin: 8px 0; background:rgba(255,255,255,0.08); padding:6px 8px; border-radius:4px; }
    .opacidade-box input[type="range"] { width:100%; cursor:pointer; margin-top:4px; }

    .legenda-box { margin-top:8px; background:white; color:#222; padding:6px; border-radius:4px; text-align:center; }
    .legenda-box img { max-width:100%; height:auto; display:block; margin:4px auto 0; }

    .popup-info table { border-collapse: collapse; width: 100%; font-size: 12px; }
    .popup-info th { text-align: left; background: #e8eefc; padding: 4px; border: 1px solid #ddd; }
    .popup-info td { padding: 4px; border: 1px solid #ddd; }
  </style>
</head>

<body>

<div class="sidebar">
  <h2>🌍 IDE LABMODEL/UERJ</h2>

  <div class="nav-grid">
    <a class="nav-link" href="index.html">🏠 Home</a>
    <a class="nav-link" href="mapa.html">🗺️ Mapa</a>
    <a class="nav-link" href="catalogo.html">📚 Catálogo</a>
    <a class="nav-link" href="producao.html">🎓 Produção</a>
    <a class="nav-link" href="submissao.html" style="grid-column: span 2;">📤 Submissão de Camadas</a>
  </div>

  <div id="aviso-modo-economico" class="status-badge">
    ⚡ Modo Econômico Ativo (Catálogo Local Estático)
  </div>

  <!-- Ferramentas Cliente estilo SIG Web / My Maps -->
  <div class="ferramentas-sig">
    <label>🛠️ Ferramentas SIG / Interoperabilidade</label>
    <input type="file" id="input-geojson-local" accept=".geojson,.json" style="display:none" onchange="carregarGeoJSONLocal(event)">
    <button class="btn-acao-sig" onclick="document.getElementById('input-geojson-local').click()">
      📂 Abrir GeoJSON do meu computador
    </button>
    <button class="btn-acao-sig" style="background:#0d9488;" onclick="limparCamadasAtivas()">
      🧹 Limpar camadas ativas do mapa
    </button>
  </div>

  <h3 style="display:flex; justify-content:space-between; align-items:center; cursor:pointer; margin-bottom:10px; font-size:15px;" onclick="toggleListaCamadas()">
    <span>🗺️ Catálogo de Camadas</span>
    <span id="icone-camadas">▼</span>
  </h3>

  <div id="painel-camadas">
    <input
      type="text"
      id="buscar-camada"
      placeholder="🔍 Buscar por título, tema ou EPSG..."
      style="width:100%; padding:9px; border:none; border-radius:6px; margin-bottom:12px; box-sizing:border-box;"
    >

    <div id="lista-camadas">Carregando camadas...</div>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const apiUrl = "/api/catalogo";
const fallbackCatalogoUrl = "/js/catalogo.json";
const geoserverProxy = "/api/geoserver";
const geoserverWfsProxy = "/api/geoserver-wfs";

const map = L.map("map").setView([-14.2, -51.9], 4);

// Escala cartográfica no canto inferior esquerdo (Padrão SIG/INDE)
L.control.scale({ metric: true, imperial: false, position: "bottomleft" }).addTo(map);

// Pane exclusivo para o WFS/GeoJSON interativo (acima do WMS)
map.createPane("paneInterativo");
map.getPane("paneInterativo").style.zIndex = 700;
map.getPane("paneInterativo").style.pointerEvents = "auto";

const rendererInterativo = L.svg({
  pane: "paneInterativo"
});

// Mapas Base para Sensoriamento Remoto e Cartografia
const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

const sateliteEsri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  attribution: "Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics"
});

const topoMap = L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenTopoMap (CC-BY-SA)"
});

const cartoDark = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
  attribution: "© CARTO"
});

const baseMaps = {
  "OpenStreetMap": osm,
  "Satélite (Esri Imagery)": sateliteEsri,
  "Topográfico (Relevo)": topoMap,
  "Fundo Escuro (Carto)": cartoDark
};

const overlayMaps = {};
const camadas = {};
const camadasAtivas = {};
let controleCamadasLeaflet = null;

const camadasReferencia = [
  {
    id: "limites_estaduais_ibge",
    titulo: "Limites estaduais IBGE",
    resumo: "Limites das Unidades da Federação do Brasil.",
    tipo_producao: "Camada de Referência",
    camada_wms: "base:limites_estaduais_ibge",
    sistema_referencia: "EPSG:4674",
    servico_ogc: "WMS / WFS"
  },
  {
    id: "limites_municipais_ibge",
    titulo: "Limites municipais IBGE",
    resumo: "Malha municipal oficial do Brasil.",
    tipo_producao: "Camada de Referência",
    camada_wms: "base:limites_municipais_ibge",
    sistema_referencia: "EPSG:4674",
    servico_ogc: "WMS / WFS"
  },
  {
    id: "regioes_hidrograficas_snirh",
    titulo: "Regiões hidrográficas SNIRH",
    resumo: "Regiões hidrográficas oficiais do Sistema Nacional de Informações sobre Recursos Hídricos.",
    tipo_producao: "Camada de Referência",
    camada_wms: "base:regioes_hidrograficas_snirh",
    sistema_referencia: "EPSG:4674",
    servico_ogc: "WMS / WFS"
  },
  {
    id: "unidades_conservacao_federais",
    titulo: "Unidades de conservação federais",
    resumo: "Limites de Unidades de Conservação Federais.",
    tipo_producao: "Camada de Referência",
    camada_wms: "base:unidades_conservacao_federais",
    sistema_referencia: "EPSG:4674",
    servico_ogc: "WMS / WFS"
  }
];

function valor(item, coluna, fallback = "") {
  const v = item[coluna];
  return v !== null && v !== undefined && String(v).trim() !== ""
    ? String(v).trim()
    : fallback;
}

function lerBounds(bbox) {
  if (!bbox || !bbox.includes("|")) return null;
  const partes = bbox.split("|");
  if (partes.length !== 2) return null;

  const p1 = partes[0].split(",").map(Number);
  const p2 = partes[1].split(",").map(Number);

  if (p1.length !== 2 || p2.length !== 2) return null;
  if (p1.some(isNaN) || p2.some(isNaN)) return null;

  return [[p1[0], p1[1]], [p2[0], p2[1]]];
}

function criarLayerWMS(item) {
  return L.tileLayer.wms(geoserverProxy, {
    layers: item.camada_wms,
    format: "image/png",
    transparent: true,
    version: "1.1.1"
  });
}

// Função nova: Controla a transparência (0 a 1) do WMS e do WFS
function alterarOpacidade(id, valorOpacidade) {
  const item = camadas[id];
  if (!item) return;
  const op = parseFloat(valorOpacidade);

  if (item.layer && item.layer.setOpacity) {
    item.layer.setOpacity(op);
  }
  if (item.layerInterativa && item.layerInterativa.setStyle) {
    item.layerInterativa.setStyle({ opacity: op, fillOpacity: op * 0.35 });
  }
}

// Função nova: Copia link WMS para o pesquisador usar no QGIS ou INDE
function copiarLinkOGC(camadaWms) {
  const urlWms = `${window.location.origin}${geoserverProxy}?service=WMS&version=1.3.0&request=GetCapabilities&layers=${camadaWms}`;
  navigator.clipboard.writeText(urlWms).then(() => {
    alert("Link WMS copiado para a área de transferência!\nCole no QGIS (Camada -> Adicionar Camada WMS) ou no Visualizador da INDE:\n\n" + urlWms);
  });
}

// Função nova: Carrega arquivo GeoJSON local do computador do usuário direto no mapa
function carregarGeoJSONLocal(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const geojson = JSON.parse(e.target.result);
      const camadaLocal = L.geoJSON(geojson, {
        pane: "paneInterativo",
        style: { color: "#e11d48", weight: 3, fillColor: "#fda4af", fillOpacity: 0.35 },
        onEachFeature: function(feature, layer) {
          let popup = `<div class="popup-info"><b>Camada Local: ${file.name}</b><br><br><table>`;
          Object.keys(feature.properties || {}).forEach(k => {
            popup += `<tr><th>${k}</th><td>${feature.properties[k]}</td></tr>`;
          });
          popup += "</table></div>";
          layer.bindPopup(popup);
        }
      }).addTo(map);

      if (camadaLocal.getBounds().isValid()) {
        map.fitBounds(camadaLocal.getBounds());
      }
      if (controleCamadasLeaflet) {
        controleCamadasLeaflet.addOverlay(camadaLocal, "📂 Local: " + file.name);
      }
    } catch (err) {
      alert("Erro ao ler o arquivo GeoJSON: " + err.message);
    }
  };
  reader.readAsText(file);
}

function limparCamadasAtivas() {
  Object.keys(camadasAtivas).forEach(id => {
    const item = camadasAtivas[id];
    if (item.layer && map.hasLayer(item.layer)) map.removeLayer(item.layer);
    if (item.layerInterativa && map.hasLayer(item.layerInterativa)) map.removeLayer(item.layerInterativa);
    delete camadasAtivas[id];
  });
  atualizarCursorConsulta();
}

function estiloWFSNormal(feature) {
  const tipo = feature && feature.geometry ? feature.geometry.type : "";
  if (tipo.includes("Line")) {
    return { color: "#0057b8", weight: 5, opacity: 0.85 };
  }
  return {
    color: "#1f3c88",
    weight: 2.5,
    opacity: 1,
    fillColor: "#d9e6f2",
    fillOpacity: 0.28,
    fill: true
  };
}

function estiloWFSHover(feature) {
  const tipo = feature && feature.geometry ? feature.geometry.type : "";
  if (tipo.includes("Line")) {
    return { color: "#ff6600", weight: 7, opacity: 1 };
  }
  return {
    color: "#0057b8",
    weight: 4,
    opacity: 1,
    fillColor: "#bcd7ee",
    fillOpacity: 0.55,
    fill: true
  };
}

async function criarLayerInterativaWFS(item) {
  if (!item.camada_wms) return null;

  // Regra Institucional: Raster NÃO usa WFS/GeoJSON
  if (item.tipo_dado && item.tipo_dado.toLowerCase().includes("raster")) {
    return null;
  }

  // Regra Institucional: Camadas base grandes usam apenas WMS
  if (item.camada_wms.startsWith("base:")) {
    return null;
  }

  if (item.layerInterativa) {
    return item.layerInterativa;
  }

  const params = new URLSearchParams({
    service: "WFS",
    version: "1.0.0",
    request: "GetFeature",
    typeName: item.camada_wms,
    outputFormat: "application/json",
    srsName: "EPSG:4326"
  });

  const resposta = await fetch(`${geoserverWfsProxy}?${params.toString()}`);
  if (!resposta.ok) {
    throw new Error("Erro WFS HTTP " + resposta.status);
  }

  const data = await resposta.json();
  if (!data.features || data.features.length === 0) {
    return null;
  }

  const layerGeojson = L.geoJSON(data, {
    pane: "paneInterativo",
    renderer: rendererInterativo,
    interactive: true,
    bubblingMouseEvents: false,
    pointToLayer: function(feature, latlng) {
      return L.circleMarker(latlng, {
        pane: "paneInterativo",
        renderer: rendererInterativo,
        radius: 7,
        color: "#1f3c88",
        weight: 2,
        fillColor: "#d9e6f2",
        fillOpacity: 0.85
      });
    },
    style: estiloWFSNormal,
    onEachFeature: function(feature, layer) {
      let popup = `<div class="popup-info"><b>${item.titulo}</b><br><br><table>`;
      Object.keys(feature.properties || {}).forEach(chave => {
        popup += `<tr><th>${chave}</th><td>${feature.properties[chave]}</td></tr>`;
      });
      popup += "</table></div>";
      layer.bindPopup(popup);

      layer.on("mouseover", function(e) {
        e.target.setStyle(estiloWFSHover(feature));
        e.target.bringToFront();
        map.getContainer().style.cursor = "pointer";
      });

      layer.on("mouseout", function(e) {
        layerGeojson.resetStyle(e.target);
        atualizarCursorConsulta();
      });

      layer.on("click", function(e) {
        if (e.originalEvent) {
          L.DomEvent.stopPropagation(e.originalEvent);
        }
        e.target.openPopup(e.latlng);
      });
    }
  });

  item.layerInterativa = layerGeojson;
  return layerGeojson;
}

async function mostrarCamada(id) {
  const item = camadas[id];
  if (!item) return;

  if (!map.hasLayer(item.layer)) {
    item.layer.addTo(map);
  }

  camadasAtivas[id] = item;

  try {
    const layerWFS = await criarLayerInterativaWFS(item);

    if (layerWFS && !map.hasLayer(layerWFS)) {
      layerWFS.addTo(map);
    }

    if (layerWFS) {
      layerWFS.bringToFront();
    }

    if (layerWFS && layerWFS.getBounds && layerWFS.getBounds().isValid()) {
      map.fitBounds(layerWFS.getBounds());
    } else if (item.bounds) {
      map.fitBounds(item.bounds);
    } else {
      map.setView([-14.2, -51.9], 4);
    }
  } catch (erro) {
    console.warn("WFS indisponível (usando bounds do catálogo):", erro.message);
    if (item.bounds) {
      map.fitBounds(item.bounds);
    } else {
      map.setView([-14.2, -51.9], 4);
    }
  }

  atualizarCursorConsulta();
}

async function toggleCamada(id) {
  const item = camadas[id];
  if (!item) return;

  if (map.hasLayer(item.layer)) {
    map.removeLayer(item.layer);
    if (item.layerInterativa && map.hasLayer(item.layerInterativa)) {
      map.removeLayer(item.layerInterativa);
    }
    delete camadasAtivas[id];
  } else {
    await mostrarCamada(id);
  }

  atualizarCursorConsulta();
}

function atualizarCursorConsulta() {
  const temCamadaAtiva = Object.keys(camadasAtivas).length > 0;
  map.getContainer().style.cursor = temCamadaAtiva ? "crosshair" : "";
}

function toggleListaCamadas() {
  const painel = document.getElementById("painel-camadas");
  const icone = document.getElementById("icone-camadas");
  if (painel.style.display === "none") {
    painel.style.display = "block";
    icone.innerHTML = "▼";
  } else {
    painel.style.display = "none";
    icone.innerHTML = "►";
  }
}

function toggleCategoria(id) {
  const conteudo = document.getElementById(id);
  const icone = document.getElementById("icone-" + id);
  if (!conteudo) return;

  if (conteudo.style.display === "none" || conteudo.style.display === "") {
    conteudo.style.display = "block";
    if (icone) icone.innerHTML = "▼";
  } else {
    conteudo.style.display = "none";
    if (icone) icone.innerHTML = "►";
  }
}

function normalizar(item) {
  const id = valor(item, "id_mapa", valor(item, "id"));
  const titulo = valor(item, "titulo", id);
  const tipo = valor(item, "tipo_producao", "Outras produções");
  const camada = valor(item, "camada_wms");
  const tipoDado = valor(item, "tipo_dado");

  return {
    id,
    titulo,
    resumo: valor(item, "resumo"),
    tipo_producao: tipo,
    tipo_dado: tipoDado,
    bounds: lerBounds(valor(item, "bbox_latlon")),
    api_features: valor(item, "api_features"),
    camada_wms: camada,
    servico_ogc: tipoDado.toLowerCase().includes("raster")
      ? "WMS"
      : "WMS / WFS / OGC API Features",
    sistema_referencia: valor(item, "epsg", "Não informado")
  };
}

function renderizarGrupo(tituloGrupo, itens, idGrupo) {
  if (!itens.length) return "";

  let html = `
    <div class="categoria">
      <div class="categoria-titulo" onclick="toggleCategoria('${idGrupo}')">
        <span>${tituloGrupo} (${itens.length})</span>
        <span id="icone-${idGrupo}">▼</span>
      </div>
      <div class="categoria-conteudo" id="${idGrupo}" style="display:block;">
  `;

  itens.forEach(item => {
    const idItem = `item-${item.id}`;
    const urlLegenda = `${geoserverProxy}?service=WMS&version=1.1.0&request=GetLegendGraphic&layer=${encodeURIComponent(item.camada_wms)}&format=image/png`;

    html += `
      <div class="layer-item">
        <button class="layer-btn" onclick="toggleCategoria('${idItem}')">
          ▸ ${item.titulo}
        </button>

        <div id="${idItem}" class="layer-box">
          <span class="tag">${item.tipo_producao}</span>
          <h4 style="margin:4px 0 6px 0;">${item.titulo}</h4>
          <p>${item.resumo || "Sem resumo informado."}</p>
          <p><b>Tipo de dado:</b> ${item.tipo_dado || "Vetorial / Referência"}</p>
          <p><b>Serviço:</b> ${item.servico_ogc}</p>
          <p><b>Camada WMS:</b> ${item.camada_wms || "Não informado"}</p>
          <p><b>SRID:</b> ${item.sistema_referencia}</p>

          <button class="layer-btn" style="background:#2563eb; text-align:center; font-weight:bold;" onclick="mostrarCamada('${item.id}')">
            🔍 Abrir e aproximar
          </button>

          <button class="layer-btn" style="background:#102653; text-align:center;" onclick="toggleCamada('${item.id}')">
            👁️ Ativar / Desativar camada
          </button>

          <!-- Controle de Opacidade -->
          <div class="opacidade-box">
            <label style="font-size:11px;">Transparência / Opacidade:</label>
            <input type="range" min="0" max="1" step="0.1" value="1" oninput="alterarOpacidade('${item.id}', this.value)">
          </div>

          <!-- Botão de Interoperabilidade QGIS / INDE -->
          <button class="layer-btn" style="background:#0f766e; text-align:center;" onclick="copiarLinkOGC('${item.camada_wms}')">
            🔗 Copiar Link WMS (QGIS / INDE)
          </button>

          ${item.api_features && !(item.tipo_dado || "").toLowerCase().includes("raster") ? `
            <a class="layer-link" href="${item.api_features}" target="_blank" rel="noopener noreferrer">
              ⚡ OGC API Features
            </a>
          ` : ""}

          <!-- Legenda Automática do GeoServer -->
          <div class="legenda-box">
            <b style="font-size:11px;">Legenda Cartográfica (SLD)</b>
            <img src="${urlLegenda}" alt="Legenda ${item.titulo}" onerror="this.parentElement.style.display='none'">
          </div>
        </div>
      </div>
    `;
  });

  html += `
      </div>
    </div>
  `;

  return html;
}

function renderCamadas(producoes) {
  const categorias = {
    "Monografia (TCC)": [],
    "Dissertação": [],
    "Tese": [],
    "Outras produções": []
  };

  producoes.forEach(item => {
    const tipo = item.tipo_producao || "";
    if (tipo.includes("Monografia") || tipo.includes("TCC")) {
      categorias["Monografia (TCC)"].push(item);
    } else if (tipo.includes("Dissertação")) {
      categorias["Dissertação"].push(item);
    } else if (tipo.includes("Tese")) {
      categorias["Tese"].push(item);
    } else {
      categorias["Outras produções"].push(item);
    }
  });

  let html = "";
  html += renderizarGrupo("Camadas de Referência (INDE/IBGE)", camadasReferencia, "grupo-referencia");
  html += renderizarGrupo("Monografia (TCC)", categorias["Monografia (TCC)"], "grupo-monografia");
  html += renderizarGrupo("Dissertação", categorias["Dissertação"], "grupo-dissertacao");
  html += renderizarGrupo("Tese", categorias["Tese"], "grupo-tese");
  html += renderizarGrupo("Outras produções", categorias["Outras produções"], "grupo-outras");

  document.getElementById("lista-camadas").innerHTML = html || "Nenhuma camada encontrada.";
}

function montarUrlGetFeatureInfo(latlng, camada) {
  const point = map.latLngToContainerPoint(latlng, map.getZoom());
  const size = map.getSize();
  const bounds = map.getBounds();
  const sw = bounds.getSouthWest();
  const ne = bounds.getNorthEast();

  const params = new URLSearchParams({
    service: "WMS",
    version: "1.1.1",
    request: "GetFeatureInfo",
    layers: camada.camada_wms,
    query_layers: camada.camada_wms,
    styles: "",
    bbox: `${sw.lng},${sw.lat},${ne.lng},${ne.lat}`,
    height: size.y,
    width: size.x,
    srs: "EPSG:4326",
    x: Math.round(point.x),
    y: Math.round(point.y),
    info_format: "application/json",
    feature_count: 10
  });

  return `${geoserverProxy}?${params.toString()}`;
}

function formatarAtributosGeoJSON(json, camadaTitulo) {
  if (!json.features || json.features.length === 0) {
    return `<b>${camadaTitulo}</b><br>Nenhum atributo encontrado neste ponto.`;
  }

  let html = `<div class="popup-info"><b>${camadaTitulo}</b><br><br>`;
  json.features.forEach((feature, index) => {
    const props = feature.properties || {};
    html += `<b>Feição ${index + 1}</b><table>`;
    Object.keys(props).forEach(chave => {
      html += `<tr><th>${chave}</th><td>${props[chave]}</td></tr>`;
    });
    html += `</table><br>`;
  });
  html += `</div>`;
  return html;
}

async function consultarCamadasAtivas(e) {
  const ativas = Object.values(camadasAtivas);
  if (ativas.length === 0) return;

  L.popup()
    .setLatLng(e.latlng)
    .setContent("Consultando camada...")
    .openOn(map);

  let conteudoFinal = "";

  for (const camada of ativas) {
    try {
      const url = montarUrlGetFeatureInfo(e.latlng, camada);
      const resposta = await fetch(url);
      if (!resposta.ok) {
        conteudoFinal += `<b>${camada.titulo}</b><br>Serviço WMS offline no momento.<br><br>`;
        continue;
      }
      const json = await resposta.json();
      conteudoFinal += formatarAtributosGeoJSON(json, camada.titulo) + "<hr>";
    } catch (erro) {
      conteudoFinal += `<b>${camada.titulo}</b><br>Erro na consulta: ${erro.message}<br><br>`;
    }
  }

  L.popup()
    .setLatLng(e.latlng)
    .setContent(conteudoFinal || "Nenhuma informação encontrada.")
    .openOn(map);
}

// Função principal com Fallback Automático para Modo Econômico
async function obterJsonCatalogo() {
  try {
    const resposta = await fetch(apiUrl);
    if (resposta.ok) {
      const dados = await resposta.json();
      if (Array.isArray(dados)) return dados;
    }
    throw new Error("API principal indisponível");
  } catch (err) {
    console.warn("Ativando fallback Modo Econômico (/js/catalogo.json)...");
    document.getElementById("aviso-modo-economico").style.display = "block";
    const respLocal = await fetch(fallbackCatalogoUrl);
    if (!respLocal.ok) throw new Error("Catálogo local também não encontrado.");
    const dadosLocais = await respLocal.json();
    return Array.isArray(dadosLocais) ? dadosLocais : (dadosLocais.camadas || dadosLocais.items || []);
  }
}

async function carregarCamadas() {
  try {
    const json = await obterJsonCatalogo();

    const producoesPublicadas = json
      .map(normalizar)
      .filter(item => item.id && item.camada_wms);

    const todas = [...camadasReferencia, ...producoesPublicadas];

    todas.forEach(item => {
      const layer = criarLayerWMS(item);
      item.layer = layer;
      camadas[item.id] = item;
      overlayMaps[item.titulo] = layer;
    });

    renderCamadas(producoesPublicadas);

    controleCamadasLeaflet = L.control.layers(baseMaps, overlayMaps).addTo(map);

    map.on("overlayadd", function(e) {
      const item = todas.find(c => c.titulo === e.name);
      if (item) {
        camadasAtivas[item.id] = item;
        if (
          item.camada_wms &&
          !item.camada_wms.startsWith("base:") &&
          !(item.tipo_dado || "").toLowerCase().includes("raster")
        ) {
          criarLayerInterativaWFS(item)
            .then(layerWFS => {
              if (layerWFS && !map.hasLayer(layerWFS)) {
                layerWFS.addTo(map);
                layerWFS.bringToFront();
              }
            })
            .catch(erro => console.warn("WFS não carregado:", erro));
        }
      }
      atualizarCursorConsulta();
    });

    map.on("overlayremove", function(e) {
      const item = todas.find(c => c.titulo === e.name);
      if (item) {
        delete camadasAtivas[item.id];
        if (item.layerInterativa && map.hasLayer(item.layerInterativa)) {
          map.removeLayer(item.layerInterativa);
        }
      }
      atualizarCursorConsulta();
    });

    map.on("click", consultarCamadasAtivas);

    const params = new URLSearchParams(window.location.search);
    const camadaSelecionada = params.get("camada");
    if (camadaSelecionada && camadas[camadaSelecionada]) {
      mostrarCamada(camadaSelecionada);
    }

    const busca = document.getElementById("buscar-camada");
    busca.addEventListener("keyup", function() {
      const termo = busca.value.toLowerCase();
      document.querySelectorAll(".layer-item").forEach(item => {
        const texto = item.innerText.toLowerCase();
        item.style.display = texto.includes(termo) ? "block" : "none";
      });
    });

  } catch (error) {
    document.getElementById("lista-camadas").innerHTML =
      "Erro ao carregar camadas: " + error.message;
    console.error(error);
  }
}

carregarCamadas();
