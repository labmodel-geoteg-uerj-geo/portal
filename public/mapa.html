<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IDE Geoespacial — LABMODEL/GEOTEG/UERJ</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-sidebar: rgba(15, 23, 42, 0.86);
      --border-glass: rgba(255, 255, 255, 0.14);
      --surface-card: rgba(255, 255, 255, 0.06);
      --surface-hover: rgba(255, 255, 255, 0.12);
      --surface-deep: rgba(0, 0, 0, 0.28);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #0f766e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --sidebar-width: 390px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: var(--text-main);
    }

    .app-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
    }

    #map {
      flex: 1;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #e2e8f0;
    }

    .leaflet-top.leaflet-left {
      left: calc(var(--sidebar-width) + 28px) !important;
      top: 12px !important;
    }
    .leaflet-bottom.leaflet-left {
      left: calc(var(--sidebar-width) + 28px) !important;
      bottom: 14px !important;
    }

    .sidebar {
      position: absolute;
      top: 14px;
      left: 14px;
      bottom: 14px;
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      border-radius: 14px;
      padding: 18px;
      overflow-y: auto;
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }

    .sidebar::-webkit-scrollbar { width: 5px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.22); border-radius: 8px; }
    .sidebar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 14px;
      margin-bottom: 14px;
    }
    .sidebar-brand img {
      height: 36px;
      width: auto;
      background: #ffffff;
      padding: 3px 6px;
      border-radius: 6px;
    }
    .sidebar-brand-text h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: #ffffff;
    }
    .sidebar-brand-text span {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .icon-svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-bottom: 16px;
    }
    .sidebar a.nav-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--text-main);
      text-decoration: none;
      padding: 8px 10px;
      background: var(--surface-card);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .sidebar a.nav-link:hover,
    .sidebar a.nav-link.active {
      background: var(--surface-hover);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .status-badge {
      display: none;
      background: rgba(245, 158, 11, 0.16);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fcd34d;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 500;
      margin-bottom: 14px;
      text-align: center;
    }

    .ferramentas-sig {
      background: var(--surface-deep);
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .ferramentas-sig label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #e2e8f0;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    .btn-acao-sig {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--primary);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      margin-top: 6px;
      transition: background 0.2s ease;
    }
    .btn-acao-sig:hover { background: var(--primary-hover); }
    .btn-acao-sig.btn-secundario { background: var(--secondary); }
    .btn-acao-sig.btn-secundario:hover { background: #115e59; }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      margin: 4px 0 10px 0;
      padding: 6px 4px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #cbd5e1;
    }
    .section-header-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      margin-bottom: 12px;
      background: rgba(15, 23, 42, 0.65);
      color: #ffffff;
      font-size: 12.5px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus { border-color: #3b82f6; }

    .categoria {
      margin-top: 10px;
      background: var(--surface-card);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .categoria-titulo {
      padding: 10px 13px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
      font-weight: 600;
      font-size: 12.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }
    .categoria-titulo:hover { background: rgba(255, 255, 255, 0.1); }
    .categoria-conteudo { padding: 8px; display: block; }

    .layer-item { margin-bottom: 6px; }
    .layer-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 8px 11px;
      margin: 3px 0;
      border-radius: 7px;
      cursor: pointer;
      text-align: left;
      font-size: 12.5px;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .layer-btn:hover {
      background: var(--surface-hover);
      border-color: rgba(255, 255, 255, 0.18);
    }
    .layer-btn.btn-center { justify-content: center; }

    .layer-box {
      display: none;
      background: var(--surface-deep);
      padding: 12px;
      border-radius: 8px;
      margin-top: 4px;
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .layer-box h4 {
      margin: 4px 0 8px 0;
      font-size: 13px;
      color: #ffffff;
    }
    .layer-box p {
      margin: 5px 0;
      color: #cbd5e1;
      line-height: 1.45;
    }
    .layer-box b { color: #ffffff; }

    .layer-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #f8fafc;
      color: #0f172a;
      padding: 8px;
      border-radius: 6px;
      text-decoration: none;
      margin-top: 8px;
      font-weight: 600;
      font-size: 12px;
      transition: background 0.2s;
    }
    .layer-link:hover { background: #e2e8f0; }

    .tag {
      display: inline-block;
      background: rgba(59, 130, 246, 0.18);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 10.5px;
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .opacidade-box {
      margin: 8px 0;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .opacidade-box input[type="range"] {
      width: 100%;
      cursor: pointer;
      margin-top: 6px;
      accent-color: #3b82f6;
    }

    .legenda-box {
      margin-top: 10px;
      background: #ffffff;
      color: #1e293b;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
    }
    .legenda-box img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 6px auto 0;
    }

    .popup-info table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 6px; }
    .popup-info th { text-align: left; background: #f1f5f9; padding: 5px 7px; border: 1px solid #cbd5e1; color: #334155; }
    .popup-info td { padding: 5px 7px; border: 1px solid #cbd5e1; color: #0f172a; }
    .popup-info b { font-size: 13px; color: #0f172a; }
  </style>
</head>

<body>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const DOMINIO_PRODUCAO = "https://ide-labmodel-geoteg-uerj.com.br";
const IS_SAME_DOMAIN = window.location.hostname.includes("ide-labmodel-geoteg-uerj.com.br");
const BASE_HOST = IS_SAME_DOMAIN ? "" : DOMINIO_PRODUCAO;

// Lista universal de rotas de API e OWS para funcionar tanto na VPS quanto na Vercel
const apiCatalogoUrls = IS_SAME_DOMAIN
  ? ["/api/catalogo", `${DOMINIO_PRODUCAO}/api/catalogo`]
  : ["/api/catalogo", `${DOMINIO_PRODUCAO}/api/catalogo`];

const fallbackCatalogoUrl = "js/catalogo.json";
const geoserverProxy = IS_SAME_DOMAIN ? "/geoserver/ows" : `${DOMINIO_PRODUCAO}/geoserver/ows`;
const geoserverWfsEndpoints = [
  IS_SAME_DOMAIN ? "/geoserver/ows" : `${DOMINIO_PRODUCAO}/geoserver/ows`,
  "/api/geoserver-wfs",
  "/api/geoserver"
];

const map = L.map("map", { zoomControl: true }).setView([-14.2, -51.9], 4);

const sidebarEl = document.getElementById("sidebar-panel");
L.DomEvent.disableScrollPropagation(sidebarEl);
L.DomEvent.disableClickPropagation(sidebarEl);

window.addEventListener("load", () => { map.invalidateSize(); });
window.addEventListener("resize", () => { map.invalidateSize(); });

L.control.scale({ metric: true, imperial: false, position: "bottomleft" }).addTo(map);

map.createPane("paneInterativo");
map.getPane("paneInterativo").style.zIndex = 700;
map.getPane("paneInterativo").style.pointerEvents = "auto";

const rendererInterativo = L.svg({
  pane: "paneInterativo"
});

const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

const sateliteEsri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  attribution: "Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics"
});

const topoMap = L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenTopoMap (CC-BY-SA)"
});

const cartoDark = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  attribution: "Tiles © Esri — Esri, DeLorme, HERE"
});

const baseMaps = {
  "OpenStreetMap": osm,
  "Satélite (Esri Imagery)": sateliteEsri,
  "Topográfico (Relevo)": topoMap,
  "Fundo Escuro (Carto)": cartoDark
};

const overlayMaps = {};
const camadas = {};
const camadasAtivas = {};
let controleCamadasLeaflet = null;

const camadasReferencia = [
  {
    id: "limites_estaduais_ibge",
    titulo: "Limites estaduais IBGE",
    resumo: "Limites das Unidades da Federação do Brasil.",
    tipo_producao: "Camada de Referência",
    camada_wms: "base:limites_estaduais_ibge",
    sistema_referencia: "EPSG:4674",
    servico_ogc: "WMS / WFS"
  },
  {
    id: "limites_municipais_ibge",
    titulo: "Limites municipais IBGE",
    resumo: "Malha municipal oficial do Brasil.",
    tipo_producao: "Camada de Referência",
    camada_wms: "base:limites_municipais_ibge",
    sistema_referencia: "EPSG:4674",
    servico_ogc: "WMS / WFS"
  },
  {
    id: "regioes_hidrograficas_snirh",
    titulo: "Regiões hidrográficas SNIRH",
    resumo: "Regiões hidrográficas oficiais do Sistema Nacional de Informações sobre Recursos Hídricos.",
    tipo_producao: "Camada de Referência",
    camada_wms: "base:regioes_hidrograficas_snirh",
    sistema_referencia: "EPSG:4674",
    servico_ogc: "WMS / WFS"
  },
  {
    id: "unidades_conservacao_federais",
    titulo: "Unidades de conservação federais",
    resumo: "Limites de Unidades de Conservação Federais.",
    tipo_producao: "Camada de Referência",
    camada_wms: "base:unidades_conservacao_federais",
    sistema_referencia: "EPSG:4674",
    servico_ogc: "WMS / WFS"
  }
];

function valor(item, coluna, fallback = "") {
  const v = item[coluna];
  return v !== null && v !== undefined && String(v).trim() !== ""
    ? String(v).trim()
    : fallback;
}

function normalizarNomeCamadaWms(camada) {
  if (!camada) return "";
  const limpa = camada.trim();
  return limpa.includes(":") ? limpa : `ide:${limpa}`;
}

function lerBounds(bbox) {
  if (!bbox) return null;
  const texto = String(bbox).trim();

  if (texto.includes("|")) {
    const partes = texto.split("|");
    if (partes.length === 2) {
      const p1 = partes[0].split(",").map(Number);
      const p2 = partes[1].split(",").map(Number);
      if (p1.length === 2 && p2.length === 2 && !p1.some(isNaN) && !p2.some(isNaN)) {
        return [[p1[0], p1[1]], [p2[0], p2[1]]];
      }
    }
  }
  return null;
}

function criarLayerWMS(item) {
  return L.tileLayer.wms(geoserverProxy, {
    layers: item.camada_wms,
    format: "image/png",
    transparent: true,
    version: "1.1.1"
  });
}

function alterarOpacidade(id, valorOpacidade) {
  const item = camadas[id];
  if (!item) return;
  const op = parseFloat(valorOpacidade);

  if (item.layer && item.layer.setOpacity) {
    item.layer.setOpacity(op);
  }
  if (item.layerInterativa && item.layerInterativa.setStyle) {
    item.layerInterativa.setStyle({ opacity: op, fillOpacity: op * 0.35 });
  }
}

function copiarLinkOGC(camadaWms) {
  const urlWms = `${DOMINIO_PRODUCAO}/geoserver/ows?service=WMS&version=1.3.0&request=GetCapabilities&layers=${camadaWms}`;
  navigator.clipboard.writeText(urlWms).then(() => {
    alert("Link WMS copiado para a área de transferência.\nCole no QGIS (Camada -> Adicionar Camada WMS) ou no Visualizador da INDE:\n\n" + urlWms);
  });
}

function carregarGeoJSONLocal(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const geojson = JSON.parse(e.target.result);
      const camadaLocal = L.geoJSON(geojson, {
        pane: "paneInterativo",
        style: { color: "#e11d48", weight: 3, fillColor: "#fda4af", fillOpacity: 0.35 },
        onEachFeature: function(feature, layer) {
          let popup = `<div class="popup-info"><b>Camada Local: ${file.name}</b><br><br><table>`;
          Object.keys(feature.properties || {}).forEach(k => {
            popup += `<tr><th>${k}</th><td>${feature.properties[k]}</td></tr>`;
          });
          popup += "</table></div>";
          layer.bindPopup(popup);
        }
      }).addTo(map);

      if (camadaLocal.getBounds().isValid()) {
        map.fitBounds(camadaLocal.getBounds(), { paddingTopLeft: [410, 20], paddingBottomRight: [20, 20] });
      }
      if (controleCamadasLeaflet) {
        controleCamadasLeaflet.addOverlay(camadaLocal, "Local: " + file.name);
      }
    } catch (err) {
      alert("Erro ao ler o arquivo GeoJSON: " + err.message);
    }
  };
  reader.readAsText(file);
}

function limparCamadasAtivas() {
  Object.keys(camadasAtivas).forEach(id => {
    const item = camadasAtivas[id];
    if (item.layer && map.hasLayer(item.layer)) map.removeLayer(item.layer);
    if (item.layerInterativa && map.hasLayer(item.layerInterativa)) map.removeLayer(item.layerInterativa);
    delete camadasAtivas[id];
  });
  atualizarCursorConsulta();
}

function estiloWFSNormal(feature) {
  const tipo = feature && feature.geometry ? feature.geometry.type : "";
  if (tipo.includes("Line")) {
    return { color: "#0057b8", weight: 5, opacity: 0.85 };
  }
  return {
    color: "#1f3c88",
    weight: 2.5,
    opacity: 1,
    fillColor: "#d9e6f2",
    fillOpacity: 0.28,
    fill: true
  };
}

function estiloWFSHover(feature) {
  const tipo = feature && feature.geometry ? feature.geometry.type : "";
  if (tipo.includes("Line")) {
    return { color: "#ff6600", weight: 7, opacity: 1 };
  }
  return {
    color: "#0057b8",
    weight: 4,
    opacity: 1,
    fillColor: "#bcd7ee",
    fillOpacity: 0.55,
    fill: true
  };
}

async function buscarGeoJSONWFSUniversal(params) {
  for (const endpoint of geoserverWfsEndpoints) {
    try {
      const resposta = await fetch(`${endpoint}?${params.toString()}`);
      if (resposta.ok) {
        const texto = await resposta.text();
        const json = JSON.parse(texto);
        if (json && Array.isArray(json.features)) {
          return json;
        }
      }
    } catch (e) {
      // Tenta o próximo endpoint
    }
  }
  throw new Error("WFS não retornou feições GeoJSON.");
}

async function criarLayerInterativaWFS(item) {
  if (!item.camada_wms) return null;

  if (item.tipo_dado && item.tipo_dado.toLowerCase().includes("raster")) {
    return null;
  }

  if (item.camada_wms.startsWith("base:")) {
    return null;
  }

  if (item.layerInterativa) {
    return item.layerInterativa;
  }

  const params = new URLSearchParams({
    service: "WFS",
    version: "1.0.0",
    request: "GetFeature",
    typeName: item.camada_wms,
    outputFormat: "application/json",
    srsName: "EPSG:4326"
  });

  const data = await buscarGeoJSONWFSUniversal(params);
  if (!data || !data.features || data.features.length === 0) {
    return null;
  }

  const layerGeojson = L.geoJSON(data, {
    pane: "paneInterativo",
    renderer: rendererInterativo,
    interactive: true,
    bubblingMouseEvents: false,
    pointToLayer: function(feature, latlng) {
      return L.circleMarker(latlng, {
        pane: "paneInterativo",
        renderer: rendererInterativo,
        radius: 7,
        color: "#1f3c88",
        weight: 2,
        fillColor: "#d9e6f2",
        fillOpacity: 0.85
      });
    },
    style: estiloWFSNormal,
    onEachFeature: function(feature, layer) {
      let popup = `<div class="popup-info"><b>${item.titulo}</b><br><br><table>`;
      Object.keys(feature.properties || {}).forEach(chave => {
        popup += `<tr><th>${chave}</th><td>${feature.properties[chave]}</td></tr>`;
      });
      popup += "</table></div>";
      layer.bindPopup(popup);

      layer.on("mouseover", function(e) {
        e.target.setStyle(estiloWFSHover(feature));
        if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
          e.target.bringToFront();
        }
        map.getContainer().style.cursor = "pointer";
      });

      layer.on("mouseout", function(e) {
        layerGeojson.resetStyle(e.target);
        atualizarCursorConsulta();
      });

      layer.on("click", function(e) {
        if (e.originalEvent) {
          L.DomEvent.stopPropagation(e.originalEvent);
        }
        e.target.openPopup(e.latlng);
      });
    }
  });

  item.layerInterativa = layerGeojson;
  return layerGeojson;
}

async function mostrarCamada(id) {
  const item = camadas[id];
  if (!item) return;

  if (!map.hasLayer(item.layer)) {
    item.layer.addTo(map);
  }

  camadasAtivas[id] = item;

  try {
    const layerWFS = await criarLayerInterativaWFS(item);

    if (layerWFS && !map.hasLayer(layerWFS)) {
      layerWFS.addTo(map);
    }

    if (layerWFS) {
      layerWFS.bringToFront();
    }

    if (layerWFS && layerWFS.getBounds && layerWFS.getBounds().isValid()) {
      map.fitBounds(layerWFS.getBounds(), { paddingTopLeft: [410, 20], paddingBottomRight: [20, 20] });
    } else if (item.bounds) {
      map.fitBounds(item.bounds, { paddingTopLeft: [410, 20], paddingBottomRight: [20, 20] });
    }
  } catch (erro) {
    console.warn("WFS indisponível (usando bounds do catálogo):", erro.message);
    if (item.bounds) {
      map.fitBounds(item.bounds, { paddingTopLeft: [410, 20], paddingBottomRight: [20, 20] });
    }
  }

  atualizarCursorConsulta();
}

async function toggleCamada(id) {
  const item = camadas[id];
  if (!item) return;

  if (map.hasLayer(item.layer)) {
    map.removeLayer(item.layer);
    if (item.layerInterativa && map.hasLayer(item.layerInterativa)) {
      map.removeLayer(item.layerInterativa);
    }
    delete camadasAtivas[id];
  } else {
    await mostrarCamada(id);
  }

  atualizarCursorConsulta();
}

function atualizarCursorConsulta() {
  const temCamadaAtiva = Object.keys(camadasAtivas).length > 0;
  map.getContainer().style.cursor = temCamadaAtiva ? "crosshair" : "";
}

function toggleListaCamadas() {
  const painel = document.getElementById("painel-camadas");
  const icone = document.getElementById("icone-camadas");
  if (painel.style.display === "none") {
    painel.style.display = "block";
    icone.innerHTML = "▾";
  } else {
    painel.style.display = "none";
    icone.innerHTML = "▸";
  }
}

function toggleCategoria(id) {
  const conteudo = document.getElementById(id);
  const icone = document.getElementById("icone-" + id);
  if (!conteudo) return;

  if (conteudo.style.display === "none" || conteudo.style.display === "") {
    conteudo.style.display = "block";
    if (icone) icone.innerHTML = "▾";
  } else {
    conteudo.style.display = "none";
    if (icone) icone.innerHTML = "▸";
  }
}

function normalizar(item) {
  const id = valor(item, "id_mapa", valor(item, "id"));
  const titulo = valor(item, "titulo", id);
  const tipo = valor(item, "tipo_producao", "Outras produções");
  const camada = normalizarNomeCamadaWms(valor(item, "camada_wms"));
  const tipoDado = valor(item, "tipo_dado");

  return {
    id,
    titulo,
    resumo: valor(item, "resumo"),
    tipo_producao: tipo,
    tipo_dado: tipoDado,
    bounds: lerBounds(valor(item, "bbox_latlon")),
    api_features: valor(item, "api_features"),
    camada_wms: camada,
    servico_ogc: tipoDado.toLowerCase().includes("raster")
      ? "WMS"
      : "WMS / WFS / OGC API Features",
    sistema_referencia: valor(item, "epsg", "EPSG:4674")
  };
}

function renderizarGrupo(tituloGrupo, itens, idGrupo) {

  let html = `
    <div class="categoria">
      <div class="categoria-titulo" onclick="toggleCategoria('${idGrupo}')">
        <span>${tituloGrupo} (${itens.length})</span>
        <span id="icone-${idGrupo}">▾</span>
      </div>
      <div class="categoria-conteudo" id="${idGrupo}" style="display:block;">
  `;

  itens.forEach(item => {
    const idItem = `item-${item.id}`;
    const urlLegenda = `${geoserverProxy}?service=WMS&version=1.1.0&request=GetLegendGraphic&layer=${encodeURIComponent(item.camada_wms)}&format=image/png`;

    html += `
      <div class="layer-item">
        <button class="layer-btn" onclick="toggleCategoria('${idItem}')">
          <span>▸</span>
          <span>${item.titulo}</span>
        </button>

        <div id="${idItem}" class="layer-box">
          <span class="tag">${item.tipo_producao}</span>
          <h4>${item.titulo}</h4>
          <p>${item.resumo || "Sem resumo informado."}</p>
          <p><b>Tipo de dado:</b> ${item.tipo_dado || "Vetorial / Referência"}</p>
          <p><b>Serviço:</b> ${item.servico_ogc}</p>
          <p><b>Camada WMS:</b> ${item.camada_wms || "Não informado"}</p>
          <p><b>SRID:</b> ${item.sistema_referencia}</p>

          <button class="layer-btn btn-center" style="background:#2563eb; font-weight:600;" onclick="mostrarCamada('${item.id}')">
            <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            Visualizar e Aproximar
          </button>

          <button class="layer-btn btn-center" style="background:#1e293b;" onclick="toggleCamada('${item.id}')">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            Ativar / Desativar Camada
          </button>

          <div class="opacidade-box">
            <label style="font-size:11px; color:#cbd5e1;">Transparência / Opacidade:</label>
            <input type="range" min="0" max="1" step="0.1" value="1" oninput="alterarOpacidade('${item.id}', this.value)">
          </div>

          <button class="layer-btn btn-center" style="background:#0f766e;" onclick="copiarLinkOGC('${item.camada_wms}')">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            Copiar Link WMS (QGIS / INDE)
          </button>

          ${item.api_features && !(item.tipo_dado || "").toLowerCase().includes("raster") ? `
            <a class="layer-link" href="${item.api_features}" target="_blank" rel="noopener noreferrer">
              OGC API Features (JSON/HTML)
            </a>
          ` : ""}

          <div class="legenda-box">
            <b style="font-size:11px;">Legenda Cartográfica (SLD)</b>
            <img src="${urlLegenda}" alt="Legenda ${item.titulo}" onerror="this.parentElement.style.display='none'">
          </div>
        </div>
      </div>
    `;
  });

  html += `
      </div>
    </div>
  `;

  return html;
}

function renderCamadas(producoes) {
  const categorias = {
    "Monografia (TCC)": [],
    "Dissertação": [],
    "Tese": [],
    "Outras produções": []
  };

  producoes.forEach(item => {
    const tipo = item.tipo_producao || "";
    if (tipo.includes("Monografia") || tipo.includes("TCC")) {
      categorias["Monografia (TCC)"].push(item);
    } else if (tipo.includes("Dissertação")) {
      categorias["Dissertação"].push(item);
    } else if (tipo.includes("Tese")) {
      categorias["Tese"].push(item);
    } else {
      categorias["Outras produções"].push(item);
    }
  });

  let html = "";
  html += renderizarGrupo("Camadas de Referência (INDE/IBGE)", camadasReferencia, "grupo-referencia");
  html += renderizarGrupo("Monografia (TCC)", categorias["Monografia (TCC)"], "grupo-monografia");
  html += renderizarGrupo("Dissertação", categorias["Dissertação"], "grupo-dissertacao");
  html += renderizarGrupo("Tese", categorias["Tese"], "grupo-tese");
  html += renderizarGrupo("Outras produções", categorias["Outras produções"], "grupo-outras");

  document.getElementById("lista-camadas").innerHTML = html || "Nenhuma camada encontrada.";
}

function montarUrlGetFeatureInfo(latlng, camada) {
  const point = map.latLngToContainerPoint(latlng, map.getZoom());
  const size = map.getSize();
  const bounds = map.getBounds();
  const sw = bounds.getSouthWest();
  const ne = bounds.getNorthEast();

  const params = new URLSearchParams({
    service: "WMS",
    version: "1.1.1",
    request: "GetFeatureInfo",
    layers: camada.camada_wms,
    query_layers: camada.camada_wms,
    styles: "",
    bbox: `${sw.lng},${sw.lat},${ne.lng},${ne.lat}`,
    height: size.y,
    width: size.x,
    srs: "EPSG:4326",
    x: Math.round(point.x),
    y: Math.round(point.y),
    info_format: "application/json",
    feature_count: 10
  });

  return `${geoserverProxy}?${params.toString()}`;
}

function formatarAtributosGeoJSON(json, camadaTitulo) {
  if (!json.features || json.features.length === 0) {
    return `<b>${camadaTitulo}</b><br>Nenhum atributo encontrado neste ponto.`;
  }

  let html = `<div class="popup-info"><b>${camadaTitulo}</b><br><br>`;
  json.features.forEach((feature, index) => {
    const props = feature.properties || {};
    html += `<b>Feição ${index + 1}</b><table>`;
    Object.keys(props).forEach(chave => {
      html += `<tr><th>${chave}</th><td>${props[chave]}</td></tr>`;
    });
    html += `</table><br>`;
  });
  html += `</div>`;
  return html;
}

async function consultarCamadasAtivas(e) {
  const ativas = Object.values(camadasAtivas);
  if (ativas.length === 0) return;

  L.popup()
    .setLatLng(e.latlng)
    .setContent("Consultando feição...")
    .openOn(map);

  let conteudoFinal = "";

  for (const camada of ativas) {
    try {
      const url = montarUrlGetFeatureInfo(e.latlng, camada);
      const resposta = await fetch(url);
      if (!resposta.ok) {
        conteudoFinal += `<b>${camada.titulo}</b><br>Serviço WMS indisponível no momento.<br><br>`;
        continue;
      }
      const json = await resposta.json();
      conteudoFinal += formatarAtributosGeoJSON(json, camada.titulo) + "<hr>";
    } catch (erro) {
      conteudoFinal += `<b>${camada.titulo}</b><br>Erro na consulta: ${erro.message}<br><br>`;
    }
  }

  L.popup()
    .setLatLng(e.latlng)
    .setContent(conteudoFinal || "Nenhuma informação encontrada.")
    .openOn(map);
}

function extrairListaCatalogo(dados) {
  if (Array.isArray(dados)) return dados;
  if (dados && typeof dados === "object") {
    return dados.camadas || dados.items || dados.data || dados.results || [];
  }
  return [];
}

async function obterJsonCatalogo() {
  for (const url of apiCatalogoUrls) {
    try {
      const resposta = await fetch(url);
      if (resposta.ok) {
        const dados = await resposta.json();
        const lista = extrairListaCatalogo(dados);
        if (lista.length > 0) {
          document.getElementById("aviso-modo-economico").style.display = "none";
          return lista;
        }
      }
    } catch (e) {
      // Tenta o próximo endpoint
    }
  }

  console.warn("Ativando fallback Modo Econômico (js/catalogo.json)...");
  document.getElementById("aviso-modo-economico").style.display = "block";
  const respLocal = await fetch(fallbackCatalogoUrl);
  if (!respLocal.ok) throw new Error("Catálogo local também não encontrado.");
  const dadosLocais = await respLocal.json();
  return extrairListaCatalogo(dadosLocais);
}

async function carregarCamadas() {
  try {
    const json = await obterJsonCatalogo();

    const producoesPublicadas = json
      .map(normalizar)
      .filter(item => item.id && item.camada_wms);

    const todas = [...camadasReferencia, ...producoesPublicadas];

    todas.forEach(item => {
      const layer = criarLayerWMS(item);
      item.layer = layer;
      camadas[item.id] = item;
      overlayMaps[item.titulo] = layer;
    });

    renderCamadas(producoesPublicadas);

    controleCamadasLeaflet = L.control.layers(baseMaps, overlayMaps).addTo(map);

    map.on("overlayadd", function(e) {
      const item = todas.find(c => c.titulo === e.name);
      if (item) {
        camadasAtivas[item.id] = item;
        if (
          item.camada_wms &&
          !item.camada_wms.startsWith("base:") &&
          !(item.tipo_dado || "").toLowerCase().includes("raster")
        ) {
          criarLayerInterativaWFS(item)
            .then(layerWFS => {
              if (layerWFS && !map.hasLayer(layerWFS)) {
                layerWFS.addTo(map);
                layerWFS.bringToFront();
              }
            })
            .catch(erro => console.warn("WFS não carregado:", erro));
        }
      }
      atualizarCursorConsulta();
    });

    map.on("overlayremove", function(e) {
      const item = todas.find(c => c.titulo === e.name);
      if (item) {
        delete camadasAtivas[item.id];
        if (item.layerInterativa && map.hasLayer(item.layerInterativa)) {
          map.removeLayer(item.layerInterativa);
        }
      }
      atualizarCursorConsulta();
    });

    map.on("click", consultarCamadasAtivas);

    const params = new URLSearchParams(window.location.search);
    const camadaSelecionada = params.get("camada");
    if (camadaSelecionada && camadas[camadaSelecionada]) {
      mostrarCamada(camadaSelecionada);
    }

    const busca = document.getElementById("buscar-camada");
    busca.addEventListener("keyup", function() {
      const termo = busca.value.toLowerCase();
      document.querySelectorAll(".layer-item").forEach(item => {
        const texto = item.innerText.toLowerCase();
        item.style.display = texto.includes(termo) ? "block" : "none";
      });
    });

  } catch (error) {
    document.getElementById("lista-camadas").innerHTML =
      "Erro ao carregar camadas: " + error.message;
    console.error(error);
  }
}

carregarCamadas();
</script>
