<!DOCTYPE html>
<html>
<head>
  <title>IDE GeoPortal</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    body { margin:0; font-family: Arial; }
    #map { height: 60vh; }
    .box { padding: 10px; }
  </style>
</head>
<body>

<h2 style="padding:10px;">IDE GeoPortal</h2>

<div id="map"></div>

<div class="box">
  <h3>Dados disponíveis</h3>

  <p><b>Uso do solo (2014)</b><br>
  <a href="https://doi.org/10.5281/zenodo.19955814" target="_blank">Download</a></p>

</div>

<script>
var map = L.map('map').setView([-22.9, -43.2], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: 'OSM'
}).addTo(map);
</script>

</body>
</html>
