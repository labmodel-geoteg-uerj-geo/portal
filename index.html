<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>IDE GeoPortal</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family: Arial; }

#map { height: 70vh; }

.topbar {
  padding: 10px;
  background: #1f2937;
  color: white;
}

.panel {
  padding: 10px;
  background: #f9f9f9;
}

button {
  margin: 5px;
  padding: 6px 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="topbar">
  <h2>IDE GeoPortal</h2>
</div>

<div id="map"></div>

<div class="panel">

<h3>Camadas</h3>

<button onclick="toggleLayer('ndvi2014')">NDVI 2014</button>
<button onclick="toggleLayer('ndvi2024')">NDVI 2024</button>
<button onclick="toggleLayer('urbano')">Área Urbana</button>
<button onclick="toggleLayer('vegetacao')">Vegetação</button>

<h3>Downloads</h3>

<p>NDVI 2014 → <a href="LINK_ZENODO" target="_blank">Download</a></p>

</div>

<script>

var map = L.map('map').setView([-22.9, -43.2], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

// ===== OBJETO DE CAMADAS =====
var layers = {};

// ===== FUNÇÃO CARREGAR GEOJSON =====
function loadLayer(name, url, style){

  fetch(url)
    .then(res => res.json())
    .then(data => {

      layers[name] = L.geoJSON(data, {
        style: style,
        onEachFeature: function(feature, layer){
          layer.bindPopup(JSON.stringify(feature.properties));
        }
      });

    });

}

// ===== DEFINA SEUS LINKS AQUI =====
loadLayer('ndvi2014',
'https://raw.githubusercontent.com/labmodel-geoteg-uerj-geo/portal/refs/heads/main/APA_JSON.geojson',
{color:'green'});

loadLayer('ndvi2024',
'https://raw.githubusercontent.com/labmodel-geoteg-uerj-geo/portal/refs/heads/main/APA_JSON.geojson',
{color:'darkgreen'});

loadLayer('urbano',
'https://raw.githubusercontent.com/labmodel-geoteg-uerj-geo/portal/refs/heads/main/APA_JSON.geojson',
{color:'red'});

loadLayer('vegetacao',
'https://raw.githubusercontent.com/labmodel-geoteg-uerj-geo/portal/refs/heads/main/APA_JSON.geojson',
{color:'blue'});

// ===== LIGAR/DESLIGAR =====
function toggleLayer(name){

  if(map.hasLayer(layers[name])){
    map.removeLayer(layers[name]);
  } else {
    layers[name].addTo(map);
  }

}

</script>

</body>
</html>
