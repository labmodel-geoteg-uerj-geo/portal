<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Mapa</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body { margin:0; }
    #map { height:100vh; }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// 🟢 MAPA BASE (PADRÃO CORRETO)
<script>
// mapa base
var map = L.map('map').setView([-22.9, -43.2], 10);

// base
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

// camada GeoServer (WMS)
L.tileLayer.wms('http://207.246.112.88:8080/geoserver/ide/wms', {
  layers: 'ide:APA_Abaete',
  format: 'image/png',
  transparent: true,
  version: '1.1.1'
}).addTo(map);
</script>

</body>
</html>
