<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>IDE Geoespacial</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>

    body {
      margin:0;
      font-family:Arial,sans-serif;
      display:flex;
    }

    .sidebar {
      width:320px;
      height:100vh;
      background:#1f3c88;
      color:white;
      padding:20px;
      box-sizing:border-box;
      overflow-y:auto;
    }

    .sidebar a {
      display:block;
      color:white;
      text-decoration:none;
      margin:8px 0;
      padding:6px;
      background:rgba(255,255,255,.1);
      border-radius:4px;
    }

    #map {
      flex:1;
      height:100vh;
    }

    .layer-btn {
      width:100%;
      background:rgba(255,255,255,.15);
      color:white;
      border:none;
      padding:8px;
      margin:8px 0;
      border-radius:4px;
      cursor:pointer;
      text-align:left;
    }

    .layer-btn:hover {
      background:rgba(255,255,255,.3);
    }

    .layer-details {
      background:rgba(255,255,255,.12);
      padding:10px;
      border-radius:6px;
      margin-top:8px;
      font-size:14px;
    }

    .layer-details a {
      background:white;
      color:#1f3c88;
      padding:6px;
      border-radius:4px;
      text-decoration:none;
    }

    .layer-item {
      margin-bottom:12px;
    }

  </style>
</head>

<body>

<div class="sidebar">

  <h2>IDE Geoespacial</h2>

  <a href="index.html">🏠 Home</a>
  <a href="mapa.html">🗺️ Mapa</a>
  <a href="catalogo.html">📚 Catálogo</a>

  <hr>

 <h3
  style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    margin-bottom:10px;
  "
  onclick="toggleListaCamadas()"
>
  <span>🗺️ Camadas publicadas</span>

  <span id="icone-camadas">
    ▼
  </span>
</h3>

<div id="painel-camadas">

  <input
    type="text"
    id="buscar-camada"
    
    placeholder="Buscar camada..."
    style="
      width:100%;
      padding:8px;
      border:none;
      border-radius:6px;
      margin-bottom:12px;
      box-sizing:border-box;
    "
  >

  <div id="lista-camadas">
    Carregando camadas...
  </div>

  <div id="detalhes-camada"></div>

</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const csvUrl =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQEuTJ7zeqTZORF6NJgcu4feZYt11ZUmiOfz7Mfxe0w6k4-FN8SiLtq5J4BFJL4k7v-PgDqVfmUbqE5/pub?gid=1492880839&single=true&output=csv";

var map = L.map('map').setView([-22.9, -43.2], 10);

var osm = L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

const baseMaps = {
  "OpenStreetMap": osm
};

const overlayMaps = {};
const camadas = {};

function parseCSV(text) {

  const rows = [];
  let row = [];
  let value = "";
  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {

    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && insideQuotes && next === '"') {

      value += '"';
      i++;

    } else if (char === '"') {

      insideQuotes = !insideQuotes;

    } else if (char === "," && !insideQuotes) {

      row.push(value.trim());
      value = "";

    } else if ((char === "\n" || char === "\r") && !insideQuotes) {

      if (value || row.length) {

        row.push(value.trim());
        rows.push(row);

        row = [];
        value = "";
      }

      if (char === "\r" && next === "\n") i++;

    } else {

      value += char;
    }
  }

  if (value || row.length) {

    row.push(value.trim());
    rows.push(row);
  }

  return rows;
}

function csvParaObjetos(csv) {

  const linhas = parseCSV(csv);

  const cabecalhos =
    linhas[0].map(h => h.trim());

  return linhas.slice(1).map(linha => {

    const obj = {};

    cabecalhos.forEach((h, i) => {

      obj[h] = linha[i] || "";

    });

    return obj;
  });
}

function normalizarId(texto) {

  return (texto || "sem_titulo")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/^_|_$/g, "");
}

function lerBounds(valor) {

  if (!valor || !valor.includes("|"))
    return null;

  const partes = valor.split("|");

  const p1 =
    partes[0].split(",").map(Number);

  const p2 =
    partes[1].split(",").map(Number);

  if (
    p1.length !== 2 ||
    p2.length !== 2
  ) return null;

  if (
    p1.some(isNaN) ||
    p2.some(isNaN)
  ) return null;

  return [
    [p1[0], p1[1]],
    [p2[0], p2[1]]
  ];
}

function criarLayer(item) {

  return L.tileLayer.wms('/api/geoserver', {

    layers: item.camada_wms,
    format: 'image/png',
    transparent: true,
    version: '1.1.1'

  });
}
  
function gerarUrlLegenda(nomeCamada) {

  return `/api/geoserver?service=WMS&version=1.1.1&request=GetLegendGraphic&format=image/png&layer=${encodeURIComponent(nomeCamada)}`;

}
function toggleCamada(id) {

  const item = camadas[id];

  if (!item) return;

  if (map.hasLayer(item.layer)) {

    map.removeLayer(item.layer);

  } else {

    item.layer.addTo(map);

  }
}

function mostrarCamada(id) {

  const item = camadas[id];

  if (!item) return;

  if (!map.hasLayer(item.layer)) {

    item.layer.addTo(map);
  }

  if (item.bounds) {

    map.fitBounds(item.bounds);
  }

  document.getElementById(
    "detalhes-camada"
  ).innerHTML = `

    <div class="layer-details">

      <h4>${item.titulo}</h4>

      <p>${item.resumo}</p>

      <p>
        <b>Serviço:</b>
        ${item.servico_ogc}
      </p>

      <p>
        <b>Camada WMS:</b>
        ${item.camada_wms}
      </p>

      <p>
        <b>SRID:</b>
        ${item.sistema_referencia}
      </p>

      <div
        style="
          margin-top:10px;
          display:flex;
          flex-direction:column;
          gap:8px;
        "
      >

        <a href="catalogo.html#${id}">
          Ver metadados
        </a>

        ${
          item.arquivo_dados
            ? `
              <a
                href="${item.arquivo_dados}"
                target="_blank"
              >
                Baixar arquivo
              </a>
            `
            : ""
        }

      </div>

    </div>
  `;
}

function toggleListaCamadas() {

  const painel =
    document.getElementById(
      "painel-camadas"
    );

  const icone =
    document.getElementById(
      "icone-camadas"
    );

  if (painel.style.display === "none") {

    painel.style.display = "block";

    icone.innerHTML = "▼";

  } else {

    painel.style.display = "none";

    icone.innerHTML = "►";
  }
}

fetch(csvUrl)

  .then(res => res.text())

  .then(csv => {

    const dados =
      csvParaObjetos(csv);

    const publicadas =
      dados.filter(item =>

        (item.status_publicacao || "")
          .toLowerCase()
          .includes("publicado")

        && item.camada_wms
        && item.bbox_latlon
      );

    let html = "";

    publicadas.forEach(item => {

      const id =
        item.id_mapa ||

        normalizarId(
          item["Título do trabalho"] ||
          item.titulo
        );

      const titulo =
        item["Título do trabalho"] ||
        item.titulo ||
        id;

      const resumo =
        item["Resumo da produção"] ||
        item.resumo ||
        "";

      const bounds =
        lerBounds(item.bbox_latlon);

      const layer =
        criarLayer(item);

      camadas[id] = {

        id,
        titulo,
        resumo,
        bounds,
        layer,

        arquivo_dados:

          item[
            "Caso a resposta da pergunta anterior tenha sido \"Sim\", insira os NOVOS dados espaciais produzidos em formato ZIP para compor a IDE do LABMODEL/UERJ. (Formatos de dados: Geopackage, Shapefile, GeoJson, KML/KMZ ou GeoTiff com simbologia)"
          ] || "",

        camada_wms:
          item.camada_wms,

        servico_ogc:
          item.servico_ogc || "WMS",

        sistema_referencia:
          item.sistema_referencia || "Não informado"
      };

      overlayMaps[titulo] = layer;

     html += `

  <div class="layer-item">

    <button
      class="layer-btn"
      onclick="mostrarCamada('${id}')"
    >
      ${titulo}
    </button>

    <div
  style="
    background:white;
    padding:8px;
    border-radius:6px;
    margin-top:6px;
    color:#1f3c88;
    font-size:12px;
  "
>
  <b>Legenda</b><br>

  <img
    src="${gerarUrlLegenda(item.camada_wms)}"
    alt="Legenda da camada"
    style="
      max-width:100%;
      display:block;
      margin-top:6px;
    "
  >
</div>

    <button
      class="layer-btn"
      style="
        background:#16306d;
        font-size:12px;
        margin-top:4px;
      "
      onclick="toggleCamada('${id}')"
    >
      Ativar / Desativar camada
    </button>

  </div>
`;
  
    });

    document.getElementById(
      "lista-camadas"
    ).innerHTML =

      html ||
      "Nenhuma camada publicada encontrada.";

    L.control.layers(
      baseMaps,
      overlayMaps
    ).addTo(map);

    const params =
      new URLSearchParams(
        window.location.search
      );

    const camadaSelecionada =
      params.get("camada");

    if (
      camadaSelecionada &&
      camadas[camadaSelecionada]
    ) {

      mostrarCamada(
        camadaSelecionada
      );
    }

    const busca =
      document.getElementById(
        "buscar-camada"
      );

    busca.addEventListener(
      "keyup",

      function() {

        const termo =
          busca.value.toLowerCase();

        document
          .querySelectorAll(".layer-item")

          .forEach(item => {

            const texto =
              item.innerText.toLowerCase();

            item.style.display =

              texto.includes(termo)
                ? "block"
                : "none";
          });
      }
    );

  })

  .catch(error => {

    document.getElementById(
      "lista-camadas"
    ).innerHTML =

      "Erro ao carregar camadas.";

    console.error(error);

  });

</script>

</body>
</html>
