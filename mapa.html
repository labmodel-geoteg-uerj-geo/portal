<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Mapa</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body { margin:0; }
    #map { height:100vh; }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// 🟢 MAPA BASE (PADRÃO CORRETO)
var map = L.map('map').setView([-22.9, -43.2], 13);

// 🟢 BASE MAP
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

// 🟢 MARCADOR TESTE
L.marker([-22.9, -43.2])
  .addTo(map)
  .bindPopup("Teste OK");

// 🟢 CAMADA WMS (GeoServer via proxy)
L.tileLayer.wms('/api/proxy', {
  layers: 'ide:APA_Lagoa_Abaete',
  format: 'image/png',
  transparent: true,
  version: '1.1.1'
}).addTo(map);

</script>

</body>
</html>
