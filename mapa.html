<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>IDE Geoespacial</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>
    body {
      margin:0;
      font-family:Arial,sans-serif;
      display:flex;
    }

    .sidebar {
      width:340px;
      height:100vh;
      background:#1f3c88;
      color:white;
      padding:20px;
      box-sizing:border-box;
      overflow-y:auto;
    }

    .sidebar a {
      display:block;
      color:white;
      text-decoration:none;
      margin:8px 0;
      padding:6px;
      background:rgba(255,255,255,.1);
      border-radius:4px;
    }

    #map {
      flex:1;
      height:100vh;
    }

    .categoria {
      margin-top:12px;
      background:rgba(255,255,255,.12);
      border-radius:6px;
      overflow:hidden;
    }

    .categoria-titulo {
      padding:10px;
      cursor:pointer;
      background:rgba(255,255,255,.18);
      font-weight:bold;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .categoria-conteudo {
      padding:8px;
      display:block;
    }

    .layer-btn {
      width:100%;
      background:rgba(255,255,255,.15);
      color:white;
      border:none;
      padding:8px;
      margin:6px 0;
      border-radius:4px;
      cursor:pointer;
      text-align:left;
    }

    .layer-btn:hover {
      background:rgba(255,255,255,.3);
    }

    .layer-details {
      background:rgba(255,255,255,.12);
      padding:10px;
      border-radius:6px;
      margin-top:12px;
      font-size:14px;
    }

    .layer-details a {
      background:white;
      color:#1f3c88;
      padding:6px;
      border-radius:4px;
      text-decoration:none;
      display:block;
    }

    .layer-item {
      margin-bottom:10px;
    }

    .tag {
      display:inline-block;
      background:white;
      color:#1f3c88;
      padding:3px 7px;
      border-radius:12px;
      font-size:12px;
      margin-bottom:6px;
    }
  </style>
</head>

<body>

<div class="sidebar">

  <h2>IDE Geoespacial</h2>

  <a href="index.html">🏠 Home</a>
  <a href="mapa.html">🗺️ Mapa</a>
  <a href="catalogo.html">📚 Catálogo</a>
  <a href="producao.html">🎓 Produção Científica</a>
  <a href="submissao.html">📤 Submissão</a>

  <hr>

  <h3
    style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      cursor:pointer;
      margin-bottom:10px;
    "
    onclick="toggleListaCamadas()"
  >
    <span>🗺️ Camadas publicadas</span>
    <span id="icone-camadas">▼</span>
  </h3>

  <div id="painel-camadas">

    <input
      type="text"
      id="buscar-camada"
      placeholder="Buscar camada..."
      style="
        width:100%;
        padding:8px;
        border:none;
        border-radius:6px;
        margin-bottom:12px;
        box-sizing:border-box;
      "
    >

    <div id="lista-camadas">
      Carregando camadas...
    </div>

    <div id="detalhes-camada"></div>

  </div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const apiUrl = "/api/catalogo";

var map = L.map("map").setView([-22.9, -43.2], 10);

var osm = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
).addTo(map);

const baseMaps = {
  "OpenStreetMap": osm
};

const overlayMaps = {};
const camadas = {};

function valor(item, coluna, fallback = "") {
  const v = item[coluna];

  return v !== null && v !== undefined && String(v).trim() !== ""
    ? String(v)
    : fallback;
}

function lerBounds(valorBBox) {
  if (!valorBBox || !valorBBox.includes("|")) {
    return null;
  }

  const partes = valorBBox.split("|");

  const p1 = partes[0].split(",").map(Number);
  const p2 = partes[1].split(",").map(Number);

  if (p1.length !== 2 || p2.length !== 2) return null;
  if (p1.some(isNaN) || p2.some(isNaN)) return null;

  return [
    [p1[0], p1[1]],
    [p2[0], p2[1]]
  ];
}

function criarLayer(item) {
  return L.tileLayer.wms("/api/geoserver", {
    layers: item.camada_wms,
    format: "image/png",
    transparent: true,
    version: "1.1.1"
  });
}

function toggleCamada(id) {
  const item = camadas[id];

  if (!item) return;

  if (map.hasLayer(item.layer)) {
    map.removeLayer(item.layer);
  } else {
    item.layer.addTo(map);
  }
}

function mostrarCamada(id) {
  const item = camadas[id];

  if (!item) return;

  if (!map.hasLayer(item.layer)) {
    item.layer.addTo(map);
  }

  if (item.bounds) {
    map.fitBounds(item.bounds);
  }

  document.getElementById("detalhes-camada").innerHTML = `
    <div class="layer-details">

      <span class="tag">${item.tipo_producao}</span>

      <h4>${item.titulo}</h4>

      <p>${item.resumo || "Sem resumo informado."}</p>

      <p><b>Serviço:</b> ${item.servico_ogc}</p>

      <p><b>Camada WMS:</b> ${item.camada_wms}</p>

      <p><b>SRID:</b> ${item.sistema_referencia}</p>

      <div
        style="
          margin-top:10px;
          display:flex;
          flex-direction:column;
          gap:8px;
        "
      >

        <a href="catalogo.html#${id}">
          Ver metadados
        </a>

        ${
          item.arquivo_dados
            ? `
              <a
                href="${item.arquivo_dados}"
                target="_blank"
              >
                Baixar arquivo
              </a>
            `
            : ""
        }

        ${
          item.api_features
            ? `
              <a
                href="${item.api_features.trim()}"
                target="_blank"
                rel="noopener noreferrer"
              >
                API Features
              </a>
            `
            : ""
        }

      </div>

    </div>
  `;
}

function toggleListaCamadas() {
  const painel = document.getElementById("painel-camadas");
  const icone = document.getElementById("icone-camadas");

  if (painel.style.display === "none") {
    painel.style.display = "block";
    icone.innerHTML = "▼";
  } else {
    painel.style.display = "none";
    icone.innerHTML = "►";
  }
}

function toggleCategoria(id) {
  const conteudo = document.getElementById(id);
  const icone = document.getElementById("icone-" + id);

  if (conteudo.style.display === "none") {
    conteudo.style.display = "block";
    icone.innerHTML = "▼";
  } else {
    conteudo.style.display = "none";
    icone.innerHTML = "►";
  }
}

function normalizar(item) {
  const id = valor(item, "id_mapa");
  const titulo = valor(item, "titulo", id);

  return {
    id,
    titulo,
    resumo: valor(item, "resumo"),
    tipo_producao: valor(item, "tipo_producao", "Sem categoria"),
    bounds: lerBounds(valor(item, "bbox_latlon")),
    arquivo_dados: valor(item, "arquivo_dados"),
    api_features: valor(item, "api_features"),
    camada_wms: valor(item, "camada_wms"),
    servico_ogc: valor(item, "servico_ogc", "WMS / OGC API Features"),
    sistema_referencia: valor(item, "sistema_referencia", valor(item, "epsg", "Não informado"))
  };
}

function renderCamadas(lista) {
  const categorias = {
    "Monografia (TCC)": [],
    "Dissertação": [],
    "Tese": [],
    "Outras produções": []
  };

  lista.forEach(item => {
    if (item.tipo_producao.includes("Monografia") || item.tipo_producao.includes("TCC")) {
      categorias["Monografia (TCC)"].push(item);
    } else if (item.tipo_producao.includes("Dissertação")) {
      categorias["Dissertação"].push(item);
    } else if (item.tipo_producao.includes("Tese")) {
      categorias["Tese"].push(item);
    } else {
      categorias["Outras produções"].push(item);
    }
  });

  let html = "";

  Object.keys(categorias).forEach((categoria, index) => {
    const itens = categorias[categoria];

    if (itens.length === 0) return;

    const idCategoria = "categoria-" + index;

    html += `
      <div class="categoria">

        <div
          class="categoria-titulo"
          onclick="toggleCategoria('${idCategoria}')"
        >
          <span>${categoria}</span>
          <span id="icone-${idCategoria}">▼</span>
        </div>

        <div class="categoria-conteudo" id="${idCategoria}">
    `;

    itens.forEach(item => {
      const idItem = `item-${item.id}`;

      html += `
        <div class="layer-item">

          <button
            class="layer-btn"
            onclick="toggleCategoria('${idItem}')"
          >
            ▸ ${item.titulo}
          </button>

          <div
            id="${idItem}"
            style="
              display:none;
              background:rgba(255,255,255,.10);
              padding:8px;
              border-radius:6px;
              margin-top:4px;
            "
          >

            <button
              class="layer-btn"
              style="background:#16306d;"
              onclick="mostrarCamada('${item.id}')"
            >
              Abrir detalhes e aproximar
            </button>

            <button
              class="layer-btn"
              style="background:#102653;"
              onclick="toggleCamada('${item.id}')"
            >
              Ativar / Desativar camada
            </button>

            <a
              href="catalogo.html#${item.id}"
              style="
                display:block;
                background:white;
                color:#1f3c88;
                padding:7px;
                border-radius:4px;
                text-decoration:none;
                margin-top:6px;
              "
            >
              Ver metadados
            </a>

            ${
              item.api_features
                ? `
                  <a
                    href="${item.api_features}"
                    target="_blank"
                    style="
                      display:block;
                      background:white;
                      color:#1f3c88;
                      padding:7px;
                      border-radius:4px;
                      text-decoration:none;
                      margin-top:6px;
                    "
                  >
                    API Features
                  </a>
                `
                : ""
            }

          </div>

        </div>
      `;
    });

    html += `
        </div>
      </div>
    `;
  });

  document.getElementById("lista-camadas").innerHTML =
    html || "Nenhuma camada publicada encontrada.";
}

fetch(apiUrl)
  .then(res => res.json())
  .then(json => {
    const publicadas = json
      .map(normalizar)
      .filter(item => item.camada_wms);

    publicadas.forEach(item => {
      const layer = criarLayer(item);

      item.layer = layer;

      camadas[item.id] = item;

      overlayMaps[item.titulo] = layer;
    });

    renderCamadas(publicadas);

    L.control.layers(
      baseMaps,
      overlayMaps
    ).addTo(map);

    const params = new URLSearchParams(window.location.search);
    const camadaSelecionada = params.get("camada");

    if (camadaSelecionada && camadas[camadaSelecionada]) {
      mostrarCamada(camadaSelecionada);
    }

    const busca = document.getElementById("buscar-camada");

    busca.addEventListener("keyup", function() {
      const termo = busca.value.toLowerCase();

      document
        .querySelectorAll(".layer-item")
        .forEach(item => {
          const texto = item.innerText.toLowerCase();

          item.style.display =
            texto.includes(termo)
              ? "block"
              : "none";
        });
    });
  })
  .catch(error => {
    document.getElementById("lista-camadas").innerHTML =
      "Erro ao carregar camadas.";

    console.error(error);
  });
</script>

</body>
</html>
