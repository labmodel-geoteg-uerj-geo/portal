<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Mapa</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body { margin:0; }
    #map { height:100vh; }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// teste mínimo absoluto
var map = L.map('map').setView([-22.9, -43.2], 10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

<script>
var map = L.map('map').setView([-22.9, -43.2], 10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

L.marker([-22.9, -43.2])
  .addTo(map)
  .bindPopup("Mapa funcionando");
</script>

</body>
</html>
