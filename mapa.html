  <p>Use o botão no mapa para ativar/desativar.</p>
</div>

<!-- 🟢 MAPA -->
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// 🟢 mapa
var map = L.map('map').setView([-22.9, -43.2], 10);

// 🟢 base
var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

// 🟢 camada GeoServer
var abaete = L.tileLayer.wms('/api/proxy', {
  layers: 'ide:APA_Abaete',
  format: 'image/png',
  transparent: true
}).addTo(map);

// 🟢 controle de camadas
L.control.layers(
  {"OpenStreetMap": osm},
  {"APA Abaete": abaete}
).addTo(map);

</script>

</body>
