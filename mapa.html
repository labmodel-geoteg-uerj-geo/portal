<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>IDE Geoespacial</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
    }

    /* 🟢 SIDEBAR */
    .sidebar {
      width: 300px;
      height: 100vh;
      background: #1f3c88;
      color: white;
      padding: 20px;
      box-sizing: border-box;
    }

    .sidebar h2 {
      margin-top: 0;
    }

    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      margin: 10px 0;
      padding: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 5px;
    }

    .sidebar a:hover {
      background: rgba(255,255,255,0.3);
    }

    /* 🟢 MAPA */
    #map {
      flex: 1;
      height: 100vh;
    }
  </style>
</head>

<body>

<!-- 🟢 MENU LATERAL -->
<div class="sidebar">
  <h2>IDE Geoespacial</h2>

  <a href="../index.html">🏠 Home</a>
  <a href="mapa.html">🗺️ Mapa</a>
  <a href="catalogo.html">📚 Catálogo</a>
  <a href="producao.html">🎓 Produção Científica</a>

  <hr>

  <h3>Camadas</h3>
  <p>Use o botão no mapa para ativar/desativar.</p>
</div>

<!-- 🟢 MAPA -->
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// 🟢 mapa
var map = L.map('map').setView([-22.9, -43.2], 10);

// 🟢 base
var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

// 🟢 camada GeoServer
var abaete = L.tileLayer.wms('/api/proxy', {
  layers: 'ide:APA_Abaete',
  format: 'image/png',
  transparent: true
}).addTo(map);

// 🟢 controle de camadas
L.control.layers(
  {"OpenStreetMap": osm},
  {"APA Abaete": abaete}
).addTo(map);

</script>

</body>
</html>
