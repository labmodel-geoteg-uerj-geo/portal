<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>IDE Geoespacial</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body { margin:0; font-family:Arial,sans-serif; display:flex; }
    .sidebar { width:300px; height:100vh; background:#1f3c88; color:white; padding:20px; box-sizing:border-box; }
    .sidebar a { display:block; color:white; text-decoration:none; margin:8px 0; padding:6px; background:rgba(255,255,255,.1); border-radius:4px; }
    #map { flex:1; height:100vh; }
  </style>
</head>
<body>

<div class="sidebar">
  <h2>IDE Geoespacial</h2>
  <a href="index.html">🏠 Home</a>
  <a href="mapa.html">🗺️ Mapa</a>
  <hr>
  <h3>🗺️ Camadas</h3>
  <a href="#">APA Abaeté</a>
  <h3>📚 Catálogo</h3>
  <a href="catalogo.html">Metadados</a>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
var map = L.map('map').setView([-22.9, -43.2], 10);

const params = new URLSearchParams(window.location.search);
const camadaSelecionada = params.get("camada");

if (camadaSelecionada === "apa_abaete") {
  map.fitBounds([
    [-12.945, -38.330],
    [-12.895, -38.270]
  ]);
}

var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

var abaete = L.tileLayer.wms('/api/geoserver', {
  layers: 'ide:apa_abaete',
  format: 'image/png',
  transparent: true,
  version: '1.1.1'
}).addTo(map);

var info = L.control({position: 'topright'});

info.onAdd = function () {

  this._div = L.DomUtil.create('div', 'info');

  this._div.innerHTML = `
    <div style="
      background:white;
      padding:12px;
      border-radius:8px;
      box-shadow:0 2px 8px rgba(0,0,0,0.2);
      width:220px;
      font-size:14px;
    ">

      <h3 style="margin-top:0;">
        APA Lagoa do Abaeté
      </h3>

      <p>
        Camada vetorial ambiental publicada via
        GeoServer + PostGIS.
      </p>

      <p>
        <b>Serviço:</b> WMS
      </p>

      <p>
        <b>SRID:</b> EPSG:31984
      </p>

      <a
        href="catalogo.html"
        style="
          display:inline-block;
          margin-top:8px;
          background:#1f3c88;
          color:white;
          padding:6px 10px;
          border-radius:4px;
          text-decoration:none;
        "
      >
        Ver metadados
      </a>

    </div>
  `;

  return this._div;
};

info.addTo(map);
  
L.control.layers(
  {"OpenStreetMap": osm},
  {"APA Abaeté - PostGIS": abaete}
).addTo(map);
</script>

</body>
</html>
