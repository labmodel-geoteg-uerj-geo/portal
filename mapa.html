<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Mapa</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body { margin:0; }
    #map { height:100vh; }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// 🟢 mapa
var map = L.map('map').setView([-22.9, -43.2], 10);

// 🟢 base
var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

// 🟢 camada GeoServer
var abaete = L.tileLayer.wms('http://207.246.112.88:8080/geoserver/ide/wms', {
  layers: 'ide:APA_Abaete',
  format: 'image/png',
  transparent: true
}).addTo(map);

// 🟢 controle
L.control.layers(
  {"OpenStreetMap": osm},
  {"APA Abaete": abaete}
).addTo(map);

</script>

</body>
</html>
