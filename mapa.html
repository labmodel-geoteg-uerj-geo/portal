<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>IDE Geoespacial</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body { margin:0; font-family:Arial,sans-serif; display:flex; }

    .sidebar {
      width:300px;
      height:100vh;
      background:#1f3c88;
      color:white;
      padding:20px;
      box-sizing:border-box;
    }

    .sidebar a {
      display:block;
      color:white;
      text-decoration:none;
      margin:8px 0;
      padding:6px;
      background:rgba(255,255,255,.1);
      border-radius:4px;
    }

    #map {
      flex:1;
      height:100vh;
    }

    .layer-btn {
      width:100%;
      background:rgba(255,255,255,0.15);
      color:white;
      border:none;
      padding:8px;
      margin:8px 0;
      border-radius:4px;
      cursor:pointer;
      text-align:left;
    }

    .layer-btn:hover {
      background:rgba(255,255,255,0.3);
    }

    .layer-details {
      background:rgba(255,255,255,0.12);
      padding:10px;
      border-radius:6px;
      margin-top:8px;
      font-size:14px;
    }

    .layer-details a {
      background:white;
      color:#1f3c88;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <h2>IDE Geoespacial</h2>

  <a href="index.html">🏠 Home</a>
  <a href="mapa.html">🗺️ Mapa</a>

  <hr>

  <h3>🗺️ Camadas disponíveis</h3>

<button
  onclick="mostrarDetalhesCamada('apa_abaete')"
  class="layer-btn"
>
  APA Lagoa do Abaeté
</button>

<div id="detalhes-camada"></div>

  <h3>📚 Catálogo</h3>
  <a href="catalogo.html">Metadados</a>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
var map = L.map('map').setView([-22.9, -43.2], 10);

var osm = L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

const configuracoesCamadas = {

  apa_abaete: {
    titulo: "APA Lagoa do Abaeté",
    wms: "ide:apa_abaete",

    bounds: [
      [-12.945, -38.330],
      [-12.895, -38.270]
    ],

    descricao:
      "Camada vetorial ambiental publicada via GeoServer + PostGIS.",

    servico: "WMS",
    srid: "EPSG:31984"
  }

};

const layersControl = {
  "OpenStreetMap": osm
};

const overlays = {};

Object.keys(configuracoesCamadas).forEach(chave => {

  const camada = configuracoesCamadas[chave];

  const layer = L.tileLayer.wms('/api/geoserver', {
    layers: camada.wms,
    format: 'image/png',
    transparent: true,
    version: '1.1.1'
  });

  overlays[camada.titulo] = layer;
});

L.control.layers(layersControl, overlays).addTo(map);

const params = new URLSearchParams(window.location.search);
const camadaSelecionada = params.get("camada");

if (
  camadaSelecionada &&
  configuracoesCamadas[camadaSelecionada]
) {

  const camada = configuracoesCamadas[camadaSelecionada];

  const layer = L.tileLayer.wms('/api/geoserver', {
    layers: camada.wms,
    format: 'image/png',
    transparent: true,
    version: '1.1.1'
  }).addTo(map);

  map.fitBounds(camada.bounds);

  criarPainelCamada(camada);
}

function mostrarDetalhesCamada(chave) {

  const camada = configuracoesCamadas[chave];

  map.fitBounds(camada.bounds);

  criarPainelCamada(camada);

  L.tileLayer.wms('/api/geoserver', {
    layers: camada.wms,
    format: 'image/png',
    transparent: true,
    version: '1.1.1'
  }).addTo(map);
}

function criarPainelCamada(camada) {

  const container = document.getElementById("detalhes-camada");

  container.innerHTML = `
    <div class="layer-details">

      <h4>${camada.titulo}</h4>

      <p>${camada.descricao}</p>

      <p>
        <b>Serviço:</b> ${camada.servico}
      </p>

      <p>
        <b>SRID:</b> ${camada.srid}
      </p>

      <a href="catalogo.html">
        Ver metadados
      </a>

    </div>
  `;
}
</script>

</body>
</html>
