<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Mapa</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body { margin:0; }
    #map { height:100vh; }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
var bounds = [[-25, -50], [-20, -40]];

var imageUrl = "http://207.246.112.88:8080/geoserver/ide/wms?" +
  "service=WMS&version=1.1.1&request=GetMap" +
  "&layers=ide:APA_Lagoa_Abaete" +
  "&styles=" +
  "&bbox=-50,-25,-40,-20" +
  "&width=800&height=600" +
  "&srs=EPSG:4326" +
  "&format=image/png";

L.imageOverlay(imageUrl, bounds).addTo(map);

// 👇 NOVO (GeoServer)
var wmsLayer = L.tileLayer.wms('http://207.246.112.88:8080/geoserver/ide/wms', {
  layers: 'ide:APA_Lagoa_Abaete',
  format: 'image/png',
  transparent: true,
  version: '1.1.1'
});

wmsLayer.addTo(map);
</script>

</body>
</html>
