<div id="map" style="height:100vh;"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
var map = L.map('map').setView([-22.9, -43.2], 10);

// base
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

// WMS do GeoServer
L.tileLayer('http://SEU_IP:8080/geoserver/wms?', {
  layers: 'workspace:layer',
  format: 'image/png',
  transparent: true
}).addTo(map);
</script>
var trabalhos = [
  {
    nome: "Dissertação NDVI",
    lat: -22.9,
    lon: -43.2,
    link: "#"
  }
];

trabalhos.forEach(t => {
  L.marker([t.lat, t.lon])
    .addTo(map)
    .bindPopup(`<b>${t.nome}</b><br><a href="${t.link}">Abrir</a>`);
});
