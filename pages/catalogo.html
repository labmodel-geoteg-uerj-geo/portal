<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Catálogo OGC</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      display: flex;
    }

    .sidebar {
      width: 300px;
      background: #1f3c88;
      color: white;
      padding: 20px;
      height: 100vh;
    }

    .sidebar a {
      color: white;
      display: block;
      margin: 8px 0;
      text-decoration: none;
    }

    .content {
      padding: 20px;
      flex: 1;
    }

    .item {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
    }

    .erro {
      color: red;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <h2>IDE Geoespacial</h2>
  <a href="../index.html">🏠 Home</a>
  <a href="mapa.html">🗺️ Mapa</a>
  <a href="catalogo.html">📚 Catálogo</a>
</div>

<div class="content">
  <h2>Catálogo de Metadados</h2>
  <div id="status">Carregando...</div>
  <div id="lista"></div>
</div>

<script>
const url = '/api/pycsw?service=CSW&version=2.0.2&request=GetRecords&resultType=results';

fetch(url)
  .then(res => res.text())
  .then(xml => {
    console.log("XML:", xml);

    const parser = new DOMParser();
    const doc = parser.parseFromString(xml, "text/xml");

    // pega TODOS os títulos ignorando namespace
    const titles = doc.getElementsByTagNameNS("*", "title");

    let html = "";

    if (titles.length === 0) {
      document.getElementById("status").innerHTML =
        "<b>⚠ Nenhum metadado encontrado</b>";
      return;
    }

    document.getElementById("status").innerHTML =
      "✔ " + titles.length + " registros encontrados";

    for (let i = 0; i < titles.length; i++) {
      html += `
        <div class="item">
          <h3>${titles[i].textContent}</h3>
        </div>
      `;
    }

    document.getElementById("lista").innerHTML = html;
  })
  .catch(err => {
    console.error(err);
    document.getElementById("status").innerHTML =
      "<span style='color:red'>Erro ao carregar catálogo</span>";
  });
</script>

</body>
</html>
