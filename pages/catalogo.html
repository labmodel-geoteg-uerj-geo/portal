<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Catálogo de Metadados</title>

  <style>
    body { margin:0; font-family:Arial,sans-serif; display:flex; background:#f4f6f8; }
    .sidebar { width:300px; height:100vh; background:#1f3c88; color:white; padding:20px; box-sizing:border-box; }
    .sidebar a { display:block; color:white; text-decoration:none; margin:8px 0; padding:6px; background:rgba(255,255,255,.1); border-radius:4px; }
    .content { flex:1; padding:30px; }
    .card { background:white; border-radius:8px; padding:18px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    .tag { display:inline-block; background:#e6eefc; color:#1f3c88; padding:4px 8px; border-radius:12px; font-size:12px; margin-right:6px; }
    .btn { display:inline-block; margin-top:10px; background:#1f3c88; color:white; padding:8px 12px; border-radius:4px; text-decoration:none; }
  </style>
</head>

<body>

<div class="sidebar">
  <h2>IDE Geoespacial</h2>
  <a href="index.html">🏠 Home</a>
  <a href="mapa.html">🗺️ Mapa</a>
  <a href="catalogo.html">📚 Catálogo</a>
  <a href="producao.html">🎓 Produção Científica</a>
</div>

<div class="content">
  <h1>Catálogo de Metadados</h1>
  <p>Dados geoespaciais organizados segundo estrutura compatível com IDE/OGC.</p>
  <div id="catalogo"></div>
</div>

<script>
fetch('js/catalogo.json')
  .then(res => res.json())
  .then(dados => {
    let html = "";

    dados.forEach(item => {
      html += `
        <div class="card">
          <h2>${item.titulo}</h2>
          <span class="tag">${item.tipo}</span>
          <span class="tag">${item.tema}</span>

          <p>${item.resumo}</p>

          <p><b>SRID:</b> ${item.srid}</p>
          <p><b>Fonte:</b> ${item.fonte}</p>
          <p><b>Camada WMS:</b> ${item.wms}</p>

          <a class="btn" href="${item.link_mapa}">Abrir no mapa</a>
        </div>
      `;
    });

    document.getElementById("catalogo").innerHTML = html;
  });
</script>

</body>
</html>
