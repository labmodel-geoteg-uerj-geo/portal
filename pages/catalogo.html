<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Catálogo OGC</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      display: flex;
    }

    .sidebar {
      width: 300px;
      background: #1f3c88;
      color: white;
      padding: 20px;
      height: 100vh;
    }

    .sidebar a {
      color: white;
      display: block;
      margin: 8px 0;
      text-decoration: none;
    }

    .content {
      padding: 20px;
      flex: 1;
    }

    .item {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
    }

    .erro {
      color: red;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <h2>IDE Geoespacial</h2>
  <a href="../index.html">🏠 Home</a>
  <a href="mapa.html">🗺️ Mapa</a>
  <a href="catalogo.html">📚 Catálogo</a>
</div>

<div class="content">
  <h2>Catálogo de Metadados</h2>
  <div id="status">Carregando...</div>
  <div id="lista"></div>
</div>

<script>
const url = '/api/pycsw?service=CSW&version=2.0.2&request=GetRecords&resultType=results';

fetch(url)
  .then(res => {
    if (!res.ok) {
      throw new Error("Erro HTTP: " + res.status);
    }
    return res.text();
  })
  .then(xml => {
    console.log("XML recebido:", xml);

    document.getElementById("status").innerText = "Processando...";

    let parser = new DOMParser();
    let doc = parser.parseFromString(xml, "text/xml");

    // pega títulos
    let records = doc.getElementsByTagName("dc:title");

    // fallback (às vezes vem como csw:Record)
    if (records.length === 0) {
      records = doc.getElementsByTagName("csw:Record");
    }

    let html = "";

    if (records.length === 0) {
      document.getElementById("status").innerHTML =
        "<span class='erro'>⚠ Nenhum metadado encontrado</span>";
      return;
    }

    document.getElementById("status").innerText =
      "✔ " + records.length + " registros encontrados";

    for (let i = 0; i < records.length; i++) {
      let titulo = records[i].textContent || "Sem título";

      html += `
        <div class="item">
          <h3>${titulo}</h3>
        </div>
      `;
    }

    document.getElementById("lista").innerHTML = html;
  })
  .catch(err => {
    console.error(err);

    document.getElementById("status").innerHTML =
      "<span class='erro'>Erro ao carregar catálogo</span>";
  });
</script>

</body>
</html>
