<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Catálogo de Metadados</title>

  <style>
    body { margin:0; font-family:Arial,sans-serif; display:flex; background:#f4f6f8; }
    .sidebar { width:300px; height:100vh; background:#1f3c88; color:white; padding:20px; box-sizing:border-box; }
    .sidebar a { display:block; color:white; text-decoration:none; margin:8px 0; padding:6px; background:rgba(255,255,255,.1); border-radius:4px; }
    .content { flex:1; padding:30px; overflow-y:auto; }
    .card { background:white; border-radius:8px; padding:20px; margin-bottom:18px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    .tag { display:inline-block; background:#e6eefc; color:#1f3c88; padding:4px 8px; border-radius:12px; font-size:12px; margin:4px 4px 4px 0; }
    .meta { margin:6px 0; }
    .btn { display:inline-block; margin-top:12px; background:#1f3c88; color:white; padding:8px 12px; border-radius:4px; text-decoration:none; }
    .grid { display:grid; grid-template-columns: repeat(2, minmax(220px, 1fr)); gap:8px 24px; }
  </style>
</head>

<body>

<div class="sidebar">
  <h2>IDE Geoespacial</h2>
  <a href="index.html">🏠 Home</a>
  <a href="mapa.html">🗺️ Mapa</a>
  <a href="catalogo.html">📚 Catálogo</a>
  <a href="producao.html">🎓 Produção Científica</a>
</div>

<div class="content">
  <h1>Catálogo de Metadados</h1>
  <p>Dados geoespaciais organizados com estrutura compatível com IDE, OGC e INDE.</p>
  <div
  style="
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
  "
>
  <input
    type="text"
    id="busca-catalogo"
    placeholder="Buscar produção, tema ou palavra-chave..."
    style="
      flex:1;
      min-width:220px;
      padding:10px;
      border:1px solid #ccc;
      border-radius:6px;
    "
  >

  <select
    id="filtro-tipo"
    style="
      padding:10px;
      border:1px solid #ccc;
      border-radius:6px;
    "
  >
    <option value="">
      Todos os tipos
    </option>
  </select>
</div>
  <div id="catalogo"></div>
</div>


<script>
const csvUrl =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQEuTJ7zeqTZORF6NJgcu4feZYt11ZUmiOfz7Mfxe0w6k4-FN8SiLtq5J4BFJL4k7v-PgDqVfmUbqE5/pub?gid=1849061582&single=true&output=csv";

function parseCSV(text) {
  const rows = [];
  let row = [];
  let value = "";
  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && insideQuotes && next === '"') {
      value += '"';
      i++;
    } else if (char === '"') {
      insideQuotes = !insideQuotes;
    } else if (char === "," && !insideQuotes) {
      row.push(value.trim());
      value = "";
    } else if ((char === "\n" || char === "\r") && !insideQuotes) {
      if (value || row.length) {
        row.push(value.trim());
        rows.push(row);
        row = [];
        value = "";
      }
      if (char === "\r" && next === "\n") i++;
    } else {
      value += char;
    }
  }

  if (value || row.length) {
    row.push(value.trim());
    rows.push(row);
  }

  return rows;
}

function csvParaObjetos(csv) {
  const linhas = parseCSV(csv);
  const cabecalhos = linhas[0].map(h => h.trim());

  return linhas.slice(1).map(linha => {
    const obj = {};

    cabecalhos.forEach((h, i) => {
      obj[h] = linha[i] || "";
    });

    return obj;
  });
}

function normalizarId(texto) {
  return (texto || "sem_titulo")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/^_|_$/g, "");
}

function valor(item, coluna, fallback = "") {
  return item[coluna] && item[coluna].trim() !== ""
    ? item[coluna]
    : fallback;
}

function normalizar(item) {
  const titulo = valor(item, "titulo");

  const id =
    valor(item, "id_mapa") ||
    normalizarId(titulo);

  return {
    id: id,

    referencia_abnt:
      valor(item, "referencia_abnt"),

    titulo:
      titulo,

    autor:
      valor(item, "autor"),

    ano:
      valor(item, "ano"),

    tipo_producao:
      valor(item, "tipo_producao", "Produção científica"),

    resumo:
      valor(item, "resumo"),

    palavras_chave:
      valor(item, "palavras_chave"),

    curso:
      valor(item, "curso"),

    dados_novos:
      valor(item, "dados_novos"),

    camada_associada:
      valor(item, "camada_associada"),

    arquivo_dados:
      valor(item, "arquivo_dados"),

    natureza_dado:
      valor(item, "natureza_dado"),

    escala_espacial:
      valor(item, "escala_espacial"),

    escala_temporal:
      valor(item, "escala_temporal"),

    ano_dados:
      valor(item, "ano_dados"),

    servico_ogc:
      valor(item, "servico_ogc", "WMS"),

    camada_wms:
      valor(item, "camada_wms"),

    sistema_referencia:
      valor(item, "sistema_referencia", "Não informado"),

    bbox_latlon:
      valor(item, "bbox_latlon"),

    bbox_projetado:
      valor(item, "bbox_projetado"),

    status_publicacao:
      valor(item, "status_publicacao"),

    link_mapa:
      `mapa.html?camada=${id}`
  };
}
function renderCatalogo(lista) {
  let html = "";

  lista.forEach(item => {
    html += `
      <div class="card" id="${item.id}">

        <h2>${item.titulo}</h2>

        <span class="tag">${item.tipo_producao}</span>
        <span class="tag">${item.natureza_dado}</span>
        <span class="tag">${item.servico_ogc}</span>

        <h3>Referência ABNT</h3>
        <p>${item.referencia_abnt}</p>

        <h3>Resumo</h3>
        <p>${item.resumo}</p>

        <h3>Informações científicas</h3>
        <div class="grid">
          <p class="meta"><b>Autor(a/e):</b> ${item.autor}</p>
          <p class="meta"><b>Ano:</b> ${item.ano}</p>
          <p class="meta"><b>Curso:</b> ${item.curso}</p>
          <p class="meta"><b>Escala espacial:</b> ${item.escala_espacial}</p>
          <p class="meta"><b>Escala temporal:</b> ${item.escala_temporal}</p>
          <p class="meta"><b>Ano(s) dos dados:</b> ${item.ano_dados}</p>
        </div>

        <h3>Palavras-chave</h3>
        <p>
          ${(item.palavras_chave || "")
            .split(";")
            .map(p => `<span class="tag">${p.trim()}</span>`)
            .join("")}
        </p>

        <h3>Informações geoespaciais</h3>
        <div class="grid">
          <p class="meta"><b>Gerou dados novos?</b> ${item.dados_novos}</p>
          <p class="meta"><b>Camada geoespacial associada?</b> ${item.camada_associada}</p>
          <p class="meta"><b>Natureza do dado:</b> ${item.natureza_dado}</p>
          <p class="meta"><b>Serviço OGC:</b> ${item.servico_ogc}</p>
          <p class="meta"><b>Camada WMS:</b> ${item.camada_wms}</p>
          <p class="meta"><b>Sistema de referência:</b> ${item.sistema_referencia}</p>
          <p class="meta"><b>BBOX lat/lon:</b> ${item.bbox_latlon}</p>
          <p class="meta"><b>BBOX projetado:</b> ${item.bbox_projetado}</p>
        </div>

        <h3>Acesso</h3>

        ${
          item.arquivo_dados
            ? `<p><a class="btn" href="${item.arquivo_dados}" target="_blank">Baixar arquivo</a></p>`
            : ""
        }

        <a class="btn" href="${item.link_mapa}">
          Abrir no mapa
        </a>

      </div>
    `;
  });

  document.getElementById("catalogo").innerHTML =
    html || "<p>Nenhum registro publicado encontrado.</p>";
}

function aplicarFiltros(dados) {
  const busca = document
    .getElementById("busca-catalogo")
    .value
    .toLowerCase();

  const tipo = document
    .getElementById("filtro-tipo")
    .value
    .toLowerCase();

  const filtrados = dados.filter(item => {
    const texto = `
      ${item.titulo}
      ${item.resumo}
      ${item.palavras_chave}
      ${item.autor}
      ${item.natureza_dado}
    `.toLowerCase();

    const okBusca = texto.includes(busca);

    const okTipo =
      !tipo ||
      item.tipo_producao.toLowerCase().includes(tipo);

    return okBusca && okTipo;
  });

  renderCatalogo(filtrados);
}

fetch(csvUrl)
  .then(res => res.text())
  .then(csv => {
    const dados = csvParaObjetos(csv)
      .map(normalizar)
      .filter(item =>
        item.status_publicacao
          .toLowerCase()
          .includes("publicado")
      );

    renderCatalogo(dados);

    const tipos = [
      ...new Set(
        dados.map(d => d.tipo_producao).filter(Boolean)
      )
    ];

    const filtroTipo = document.getElementById("filtro-tipo");

    tipos.forEach(tipo => {
      filtroTipo.innerHTML += `
        <option value="${tipo}">
          ${tipo}
        </option>
      `;
    });

    document
      .getElementById("busca-catalogo")
      .addEventListener("keyup", () => aplicarFiltros(dados));

    document
      .getElementById("filtro-tipo")
      .addEventListener("change", () => aplicarFiltros(dados));
  })
  .catch(error => {
    document.getElementById("catalogo").innerHTML =
      "<p>Erro ao carregar o catálogo automático.</p>";

    console.error(error);
  });
</script>


</body>
</html>
