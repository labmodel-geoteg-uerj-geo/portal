services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ide}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  geoserver:
    image: docker.osgeo.org/geoserver:2.26.x
    container_name: geoserver
    restart: unless-stopped
    depends_on:
      - postgis
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      INITIAL_MEMORY: ${GEOSERVER_INITIAL_MEMORY:-512m}
      MAXIMUM_MEMORY: ${GEOSERVER_MAXIMUM_MEMORY:-2g}
      EXTRA_JAVA_OPTS: "-Dfile.encoding=UTF-8"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - geoserver_data:/opt/geoserver_data

  pygeoapi:
    image: geopython/pygeoapi:latest
    container_name: pygeoapi
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:80"

  pycsw:
    image: geopython/pycsw:latest
    container_name: pycsw
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgis_data:
  geoserver_data:
